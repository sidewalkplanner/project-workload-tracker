# Uploads webapp/ to the tracker's Apps Script project and publishes it on the existing
# deployment (same link) whenever webapp/ changes on main, so nobody copies files by
# hand. It can also be started by hand: Actions › Upload to Apps Script › Run workflow.
# Pull requests only run the tests. See docs/DEPLOYMENT.md, "Automatic updates from GitHub".
name: Upload to Apps Script

on:
  push:
    branches: [main]
    paths: ['webapp/**', '.github/**']
  pull_request:
  workflow_dispatch:

# One upload at a time, in order.
concurrency:
  group: apps-script-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Apps Script › Project Settings › IDs, and Deploy › Manage deployments. Not secrets.
  # Leave DEPLOYMENT_ID blank until the web app has been deployed once; uploads still work.
  SCRIPT_ID: 1Z6ql0QyOvGvUnsOUTs6wwiFvuBIOJdCu78zQwX3G0oMJEhT0JSe9_AZZ
  DEPLOYMENT_ID: ''
  CLASP: npx --yes @google/clasp@2.4.2

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Run the tests (nothing is uploaded if they fail)
        run: node dev/test.js

      - name: Sign in to Google
        if: github.event_name != 'pull_request'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$SCRIPT_ID" ]; then
            echo "::error::SCRIPT_ID is blank in .github/workflows/apps-script.yml. See docs/DEPLOYMENT.md, 'Automatic updates from GitHub'."
            exit 1
          fi
          node .github/scripts/clasprc.js

      - name: Upload webapp/ (same as pasting every file and saving)
        if: github.event_name != 'pull_request'
        working-directory: webapp
        run: |
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json
          $CLASP push --force

      - name: Publish a new version on the existing deployment (same link)
        if: github.event_name != 'pull_request' && env.DEPLOYMENT_ID != ''
        working-directory: webapp
        run: $CLASP deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$DEPLOYMENT_ID" ]; then
            echo "Uploaded and published ${GITHUB_SHA::7}. People see it on the regular link after a reload." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Uploaded ${GITHUB_SHA::7}. Not published: DEPLOYMENT_ID is blank (deploy the web app once, then fill it in)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sign out
        if: ${{ always() }}
        run: rm -f "$HOME/.clasprc.json" webapp/.clasp.json
