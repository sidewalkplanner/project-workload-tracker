<style>
/* ==========================================================================
   NEH Projects — styles
   Federal (USWDS-inspired) palette, Public Sans, light + dark themes.
   ========================================================================== */
/* Type, space and touch tokens. Sizes in rem (16px root); the 15px floor
   (--fs-secondary) applies to any text a reader needs. Tags are the one 14px exception. */
:root {
  --fs-page-title: 1.75rem;   /* 28px */
  --fs-section: 1.375rem;     /* 22px */
  --fs-card-title: 1.1875rem; /* 19px */
  --fs-body: 1.0625rem;       /* 17px */
  --fs-table: 1rem;           /* 16px */
  --fs-secondary: 0.9375rem;  /* 15px */
  --fs-label: 0.9375rem;      /* 15px */
  --fs-tag: 0.875rem;         /* 14px */
  --fs-stat: 2.125rem;        /* 34px */
  --lh-body: 1.55;
  --lh-tight: 1.3;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px;
  --control-h: 44px;
}
@media (max-width: 640px) {
  :root { --control-h: 48px; --fs-stat: 1.75rem; }
}
:root {
  color-scheme: light;
  --font: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --page: #f3f4f5;
  --surface: #ffffff;
  --surface-2: #f7f8f9;
  --surface-3: #eef0f2;
  --ink: #1b1b1b;
  --ink-2: #3d4551;
  --ink-3: #4a5058;        /* 7.39:1 on --page, 8.14 on --surface, 7.13 on --surface-3 */
  --line: #dfe1e2;
  --line-strong: #c6cace;
  --field-border: #7c8288; /* 3.53:1 on --page, 3.88 on --surface (WCAG 1.4.11) */
  --focus: #2491ff;
  --primary: #005ea2;
  --primary-hover: #1a4480;
  --primary-ink: #ffffff;
  --primary-soft: #e7f2fb;
  --navy: #162e51;
  --navy-2: #1f3d68;
  --on-navy: #d6e2f1;      /* text on the navy header */
  --on-navy-2: #c5d4e8;
  --warning: #7a5600;
  --warning-soft: #fdf2d0;
  --success: #00703c;
  --success-soft: #e6f3ec;
  /* Program identity (categorical slots 1-3, validated) + neutral Other */
  --ba61: #2a78d6;
  --ba80: #eb6834;
  --ba54: #1baf7a;
  --other: #8d9297;
  /* Stage groups: an ordinal blue ramp, lightest to darkest, every step >= 3:1 on --surface
     (planned 3.33, in contracting 6.61, awarded 13.3; neighbours about 2:1 apart), and a neutral for paid in full (3.68). */
  --planned: #4c8fdf;
  --preaward: #1d5bb0;
  --awarded: #0b2f5c;
  --expended: #80868d;
  --bar-track: #eef0f2;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 2px 8px rgba(16, 24, 40, .05);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, .18);
}
/* Dark: --ink-3 7.31:1 or better on every surface, --field-border 4.19 on --surface,
   ramp dim to bright (planned 3.33, in contracting 6.58, awarded 12.5 on --surface), paid in full 3.68. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0f1115; --surface: #171a1f; --surface-2: #1d2127; --surface-3: #252a31;
    --ink: #eef0f2; --ink-2: #cfd3d8; --ink-3: #b4b9bf;
    --line: #2e343c; --line-strong: #3d444d; --field-border: #757d87;
    --primary: #4a9fe6; --primary-hover: #73b3ec; --primary-ink: #0b1a2b; --primary-soft: #14273b;
    --navy: #0c1a2e; --navy-2: #15294a;
    --warning: #f2c55c; --warning-soft: #2c240e; --success: #4fbf7c; --success-soft: #11291c;
    --ba61: #3987e5; --ba80: #d95926; --ba54: #199e70; --other: #6b737d;
    --planned: #2a6cc0; --preaward: #5ea2f2; --awarded: #c4ddfb; --expended: #6c747d; --bar-track: #252a31;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0f1115; --surface: #171a1f; --surface-2: #1d2127; --surface-3: #252a31;
  --ink: #eef0f2; --ink-2: #cfd3d8; --ink-3: #b4b9bf;
  --line: #2e343c; --line-strong: #3d444d; --field-border: #757d87;
  --primary: #4a9fe6; --primary-hover: #73b3ec; --primary-ink: #0b1a2b; --primary-soft: #14273b;
  --navy: #0c1a2e; --navy-2: #15294a;
  --warning: #f2c55c; --warning-soft: #2c240e; --success: #4fbf7c; --success-soft: #11291c;
  --ba61: #3987e5; --ba80: #d95926; --ba54: #199e70; --other: #6b737d;
  --planned: #2a6cc0; --preaward: #5ea2f2; --awarded: #c4ddfb; --expended: #6c747d; --bar-track: #252a31;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { font-family: var(--font); font-size: var(--fs-body); line-height: var(--lh-body); color: var(--ink); background: var(--page); -webkit-font-smoothing: antialiased; accent-color: var(--primary); }
::selection { background: var(--primary-soft); color: var(--ink); }
a { color: var(--primary); text-underline-offset: 2px; }
a:hover { color: var(--primary-hover); }
h1, h2, h3 { text-wrap: balance; line-height: var(--lh-tight); }
p, li, dd { text-wrap: pretty; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
tr[tabindex]:focus-visible { outline-offset: -3px; }
.skip-link { position: absolute; left: -9999px; top: 0; display: inline-flex; align-items: center; min-height: var(--control-h); background: var(--surface); padding: 0 var(--space-4); z-index: 100; }
.skip-link:focus { left: 8px; top: 8px; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.muted { color: var(--ink-3); }
.small { font-size: var(--fs-secondary); }
.nowrap { white-space: nowrap; }
input[type="checkbox"] { accent-color: var(--primary); width: 20px; height: 20px; margin: 0; flex: none; }
.icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Boot / states ---------- */
.boot, .state { display: flex; align-items: center; justify-content: center; gap: var(--space-3); min-height: 60vh; color: var(--ink-3); flex-direction: column; text-align: center; padding: var(--space-5); }
.state h2 { color: var(--ink); margin: 0; font-size: var(--fs-section); }
.state p { max-width: 560px; margin: 0; }
@media (prefers-reduced-motion: reduce) {
  .spinner { animation-duration: 2.4s; }
  tr.group-row .caret, .attention-item, .hbar { transition: none; }
}
.loading-note { display: flex; align-items: center; gap: var(--space-2); margin: var(--space-2) 0 0; font-size: var(--fs-secondary); color: var(--ink-3); }
.spinner.small { width: 14px; height: 14px; border-width: 2px; }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--primary); animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Top bar ---------- */
.topbar { background: var(--navy); color: #fff; }
.topbar-inner { max-width: 1480px; margin: 0 auto; padding: 14px var(--space-5) 0; display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-2) var(--space-5); }
.brand { display: flex; flex-direction: column; padding-bottom: var(--space-3); margin-right: auto; }
.brand-title { font-size: 1.5rem; font-weight: 700; letter-spacing: -.015em; margin: 0; line-height: 1.25; }
.brand-sub { font-size: var(--fs-secondary); line-height: 1.4; color: var(--on-navy-2); }
.tabs { display: flex; gap: var(--space-1); }
.tab { display: inline-flex; align-items: center; justify-content: center; min-height: var(--control-h); background: transparent; border: 0; color: var(--on-navy); padding: 10px var(--space-4); font-size: var(--fs-table); font-weight: 600; line-height: 1.2; cursor: pointer; border-radius: 8px 8px 0 0; }
.tab:hover { color: #fff; background: var(--navy-2); }
.tab[aria-current="page"] { background: var(--page); color: var(--ink); }
.freshness { display: flex; align-items: center; gap: 10px; font-size: var(--fs-secondary); color: var(--on-navy-2); padding-bottom: var(--space-3); }
.btn-on-dark { display: inline-flex; align-items: center; min-height: var(--control-h); background: transparent; border: 1px solid #6f87ab; color: #fff; border-radius: 6px; padding: 0 var(--space-4); cursor: pointer; font-size: var(--fs-label); font-weight: 600; }
.btn-on-dark:hover { background: var(--navy-2); }
.btn-on-dark[disabled] { opacity: .6; cursor: default; }

/* ---------- Layout ---------- */
main { max-width: 1480px; margin: 0 auto; padding: var(--space-4) var(--space-5) var(--space-7); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-pad { padding: 18px 20px; }
.card h2 { font-size: var(--fs-card-title); margin: 0; line-height: var(--lh-tight); }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; padding: var(--space-4) 20px var(--space-3); }
.card-head p { margin: var(--space-1) 0 0; color: var(--ink-3); font-size: var(--fs-secondary); line-height: 1.5; }
.grid { display: grid; gap: var(--space-4); }
.grid-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.grid-main { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); align-items: start; }
.stack > * + * { margin-top: var(--space-4); }

/* ---------- Filters ---------- */
.filters { position: sticky; top: 0; z-index: 20; background: var(--page); padding: var(--space-3) 0; border-bottom: 1px solid var(--line); margin-bottom: var(--space-4); }
.filter-row { display: flex; flex-wrap: wrap; gap: var(--space-3) var(--space-4); align-items: flex-end; }
.more-row { margin-top: var(--space-3); }
.more-btn { align-self: flex-end; }
/* Wider screens: fields, "More filters" and the active-filter links share one wrapping flow,
   so Reset and My projects sit beside Search instead of taking a row of their own. */
@media (min-width: 641px) {
  .filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-3) var(--space-4); }
  .filters > .filter-row:not(.more-row) { display: contents; }
  .filters > .more-row, .filters > .loading-note { flex: 1 1 100%; margin-top: 0; }
  .filters > .active-filters { margin-top: 0; }
}
.filters-toggle { display: none; width: 100%; align-items: center; gap: 10px; min-height: var(--control-h); padding: 0 14px; border: 1px solid var(--field-border); border-radius: 8px; background: var(--surface); cursor: pointer; text-align: left; font-size: var(--fs-label); }
.filters-summary { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; color: var(--ink); }
.filters-action { color: var(--primary); font-weight: 700; }
.field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.field > span { font-size: var(--fs-label); line-height: 1.3; font-weight: 600; color: var(--ink-2); }
select, input[type="search"] { height: var(--control-h); border: 1px solid var(--field-border); border-radius: 6px; background: var(--surface); padding: 0 var(--space-3); max-width: 100%; font-size: var(--fs-table); }
select { padding-right: 28px; }
input[type="search"] { width: 240px; }
.seg { display: inline-flex; border: 1px solid var(--field-border); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { display: inline-flex; align-items: center; gap: 6px; min-height: var(--control-h); border: 0; background: transparent; padding: 0 var(--space-3); cursor: pointer; font-size: var(--fs-label); font-weight: 500; color: var(--ink-2); border-right: 1px solid var(--line); white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); font-weight: 600; }
.chip-toggle { display: inline-flex; align-items: center; gap: 6px; min-height: var(--control-h); padding: 0 var(--space-3); border: 1px solid var(--field-border); border-radius: 22px; background: var(--surface); cursor: pointer; font-weight: 600; font-size: var(--fs-label); color: var(--ink-2); }
.seg .dot { width: 10px; height: 10px; border-radius: 3px; }
.chip-toggle .dot { width: 10px; height: 10px; border-radius: 3px; }
.chip-toggle[aria-pressed="false"] { opacity: .55; border-style: dashed; }
.chip-toggle[aria-pressed="false"] .dot { background: transparent !important; border: 2px solid var(--field-border); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.active-filters { display: flex; gap: var(--space-1) var(--space-3); flex-wrap: wrap; align-items: center; margin-top: var(--space-2); font-size: var(--fs-secondary); }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; background: var(--primary-soft); color: var(--ink); border-radius: 18px; padding: 2px 4px 2px 12px; font-weight: 500; }
.pill button { border: 0; background: transparent; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; padding: 0; position: relative; }
.pill button::after { content: ''; position: absolute; inset: -6px; }
.pill .icon { width: 16px; height: 16px; }
.pill button:hover { background: var(--surface); }
/* Text-styled buttons keep a 44px hit area without looking like boxes. */
.link-btn { display: inline-flex; align-items: center; min-height: var(--control-h); border: 0; background: none; color: var(--primary); cursor: pointer; padding: 0 2px; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; text-align: left; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--control-h); padding: 0 var(--space-4); border: 1px solid var(--field-border); border-radius: 6px; background: var(--surface); cursor: pointer; font-weight: 600; font-size: var(--fs-label); color: var(--ink-2); white-space: nowrap; }
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn-primary:hover { background: var(--primary-hover); color: var(--primary-ink); }

.banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--primary-soft); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-4); margin-bottom: var(--space-4); font-size: var(--fs-secondary); }
.banner .icon { color: var(--primary); width: 18px; height: 18px; align-self: flex-start; margin-top: 3px; }
.banner-text { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 0 var(--space-3); align-items: baseline; }

/* ---------- Summary strip ---------- */
.summary { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin-bottom: var(--space-4); }
.summary.six { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.stat { padding: var(--space-4) 20px; min-width: 0; text-align: left; border: 0; background: transparent; font: inherit; color: inherit; }
.stat.clickable { cursor: pointer; display: flex; flex-direction: column; justify-content: flex-start; }
.stat.clickable:hover { background: var(--surface-2); }
.stat.clickable:hover .value { color: var(--primary); }
.stat + .stat { border-left: 1px solid var(--line); }
.stat .label { font-size: var(--fs-label); font-weight: 600; color: var(--ink-2); line-height: 1.35; }
.stat .value { font-size: var(--fs-stat); font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin-top: var(--space-1); font-variant-numeric: tabular-nums; }
.stat .sub { font-size: var(--fs-secondary); line-height: 1.4; color: var(--ink-3); margin-top: var(--space-1); }

/* ---------- Bars ---------- */
.hbars { padding: var(--space-1) 20px 18px; }
.hbar { display: grid; grid-template-columns: 200px minmax(0, 1fr) 72px; gap: var(--space-3); align-items: center; min-height: var(--control-h); padding: 2px 0; border-radius: 6px; cursor: pointer; background: none; border: 0; width: 100%; text-align: left; }
.hbar:hover .hbar-label { color: var(--primary); text-decoration: underline; }
.hbar[aria-pressed="true"] .hbar-label { font-weight: 700; color: var(--primary); }
.hbar-label { font-size: var(--fs-table); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar-track { height: 16px; display: flex; gap: 2px; position: relative; }
.hbars.people .hbar { grid-template-columns: minmax(150px, 240px) minmax(0, 1fr) 44px; }
.phase { padding: 6px 0 0; }
.phase + .phase { border-top: 1px solid var(--line); margin: var(--space-2) 20px 0; }
.phase + .phase .phase-head, .phase + .phase .hbars, .phase + .phase .phase-note { padding-left: 0; padding-right: 0; }
.phase-head { display: flex; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; padding: var(--space-2) 20px var(--space-1); font-size: var(--fs-table); font-weight: 600; }
.phase-head .muted { font-weight: 400; font-size: var(--fs-secondary); }
.phase .hbars { padding-bottom: var(--space-2); }
.phase-note { margin: 0; padding: 0 20px var(--space-3); }
.hbars-title { padding: var(--space-2) 20px 0; font-size: var(--fs-secondary); font-weight: 600; color: var(--ink-3); }
.hbars-title + .hbars { padding-top: 0; }
.hbars.after { border-top: 1px solid var(--line); margin: 0 20px; padding: var(--space-2) 0 14px; }
.hbars.after .hbar { grid-template-columns: 200px minmax(0, 1fr) 72px; }
.hbar-note { font-size: var(--fs-secondary); color: var(--ink-3); }
.hbar-value.zero { color: var(--ink-3); font-weight: 500; }
.avg-line { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 2px dashed var(--ink-3); transform: translateX(-1px); pointer-events: none; }
.swatch-line { display: inline-block; width: 0; height: 14px; border-left: 2px dashed var(--ink-3); margin: 0 4px; }
.chart-legend { padding: 0 20px var(--space-1); }
.card-foot { margin: 0; padding: 0 20px var(--space-4); font-size: var(--fs-secondary); line-height: 1.5; color: var(--ink-3); }
.seg-fill { height: 100%; min-width: 0; }
.seg-fill:first-child { border-radius: 4px 0 0 4px; }
.seg-fill:last-child { border-radius: 0 4px 4px 0; }
.seg-fill:only-child { border-radius: 0 4px 4px 0; }
.hbar-value { font-size: var(--fs-table); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: var(--space-1) var(--space-4); flex-wrap: wrap; font-size: var(--fs-secondary); color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
.mini-bar { display: flex; gap: 2px; height: 12px; min-width: 80px; position: relative; }
td.bar-cell { min-width: 100px; vertical-align: middle; }
td.bar-cell.wide { min-width: 120px; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; border-top: 1px solid var(--line); scrollbar-color: var(--line-strong) transparent; scrollbar-width: thin; }
table { border-collapse: collapse; width: 100%; font-size: var(--fs-table); line-height: 1.45; }
th, td { padding: 10px var(--space-3); border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
thead th { position: sticky; top: 0; background: var(--surface-2); font-size: var(--fs-label); line-height: 1.3; color: var(--ink-2); font-weight: 600; white-space: nowrap; z-index: 1; vertical-align: bottom; }
th.sortable { cursor: pointer; user-select: none; }
/* Two-word number headings ("Not in EASi", "Left to spend") may take two lines so wide tables fit. */
thead th.num { white-space: normal; }
th.sortable:hover { color: var(--primary); }
.th-inner { display: inline-flex; align-items: center; gap: 2px; }
th.num .th-inner { justify-content: flex-end; }
th .arrow { display: inline-flex; width: 14px; color: var(--primary); }
th .arrow .icon { width: 14px; height: 14px; stroke-width: 2.5; }
th .rank { font-size: 0.75rem; vertical-align: super; color: var(--primary); } /* sort order digit beside the arrow; decorative */
tbody tr:hover td { background: var(--surface-2); }
tbody tr.clickable { cursor: pointer; }
tr.group-row td { background: var(--surface-3); font-weight: 700; cursor: pointer; }
tr.group-row:hover td { background: var(--surface-3); }
tr.group-row .caret { display: inline-flex; width: 20px; transition: transform .15s ease-out; }
tr.group-row.collapsed .caret { transform: rotate(-90deg); }
tr.total-row td { font-weight: 700; background: var(--surface-2); border-bottom: 0; }
tbody tr.current td, tbody tr.current:hover td { background: var(--primary-soft); }
tbody tr.current td:first-child strong { color: var(--primary-hover); }
td.title-cell { min-width: 240px; max-width: 320px; }
td .sub { font-size: var(--fs-secondary); line-height: 1.4; color: var(--ink-3); margin-top: 2px; }
td.title-cell .sub { display: flex; flex-wrap: wrap; gap: 2px var(--space-2); align-items: center; }
td.tags-cell { min-width: 70px; }
td.office-cell { min-width: 110px; max-width: 160px; }
td.lead-cell { min-width: 140px; max-width: 190px; }
td.award-cell { min-width: 140px; max-width: 190px; }
