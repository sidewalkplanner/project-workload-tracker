<style>
/* ==========================================================================
   Zone 5 Project Workload Tracker — styles
   Federal (USWDS-inspired) palette, Public Sans, light + dark themes.
   ========================================================================== */
:root {
  color-scheme: light;
  --font: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --page: #f3f4f5;
  --surface: #ffffff;
  --surface-2: #f7f8f9;
  --surface-3: #eef0f2;
  --ink: #1b1b1b;
  --ink-2: #3d4551;
  --ink-3: #5c636b;
  --line: #dfe1e2;
  --line-strong: #c6cace;
  --field-border: #8d9297;
  --focus: #2491ff;
  --primary: #005ea2;
  --primary-hover: #1a4480;
  --primary-ink: #ffffff;
  --primary-soft: #e7f2fb;
  --navy: #162e51;
  --navy-2: #1f3d68;
  --warning: #7a5600;
  --warning-soft: #fdf2d0;
  --success: #00703c;
  --success-soft: #e6f3ec;
  /* Program identity (categorical slots 1-3, validated) + neutral Other */
  --ba61: #2a78d6;
  --ba80: #eb6834;
  --ba54: #1baf7a;
  --other: #8d9297;
  /* Stage groups (ordinal blue: pre-award lighter, awarded darker) */
  --preaward: #5598e7;
  --awarded: #104281;
  --expended: #c6cace;
  --bar-track: #eef0f2;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 2px 8px rgba(16, 24, 40, .05);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, .18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0f1115; --surface: #171a1f; --surface-2: #1d2127; --surface-3: #252a31;
    --ink: #eef0f2; --ink-2: #cfd3d8; --ink-3: #a9aeb4;
    --line: #2e343c; --line-strong: #3d444d; --field-border: #6b737d;
    --primary: #4a9fe6; --primary-hover: #73b3ec; --primary-ink: #0b1a2b; --primary-soft: #14273b;
    --navy: #0c1a2e; --navy-2: #15294a;
    --warning: #f2c55c; --warning-soft: #2c240e; --success: #4fbf7c; --success-soft: #11291c;
    --ba61: #3987e5; --ba80: #d95926; --ba54: #199e70; --other: #6b737d;
    --preaward: #2a78d6; --awarded: #b7d3f6; --expended: #3d444d; --bar-track: #252a31;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0f1115; --surface: #171a1f; --surface-2: #1d2127; --surface-3: #252a31;
  --ink: #eef0f2; --ink-2: #cfd3d8; --ink-3: #a9aeb4;
  --line: #2e343c; --line-strong: #3d444d; --field-border: #6b737d;
  --primary: #4a9fe6; --primary-hover: #73b3ec; --primary-ink: #0b1a2b; --primary-soft: #14273b;
  --navy: #0c1a2e; --navy-2: #15294a;
  --warning: #f2c55c; --warning-soft: #2c240e; --success: #4fbf7c; --success-soft: #11291c;
  --ba61: #3987e5; --ba80: #d95926; --ba54: #199e70; --other: #6b737d;
  --preaward: #2a78d6; --awarded: #b7d3f6; --expended: #3d444d; --bar-track: #252a31;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: var(--font); font-size: 16px; line-height: 1.45; color: var(--ink); background: var(--page); -webkit-font-smoothing: antialiased; }
a { color: var(--primary); }
a:hover { color: var(--primary-hover); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.skip-link { position: absolute; left: -9999px; top: 0; background: var(--surface); padding: 8px 12px; z-index: 100; }
.skip-link:focus { left: 8px; top: 8px; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.nowrap { white-space: nowrap; }
::selection { background: var(--primary-soft); color: var(--ink); }
input[type="checkbox"] { accent-color: var(--primary); width: 16px; height: 16px; margin: 0; }
.icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Boot / states ---------- */
.boot, .state { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 60vh; color: var(--ink-3); flex-direction: column; text-align: center; padding: 24px; }
.state h2 { color: var(--ink); margin: 0; font-size: 20px; }
.state p { max-width: 560px; margin: 0; }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--primary); animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Top bar ---------- */
.topbar { background: var(--navy); color: #fff; }
.topbar-inner { max-width: 1480px; margin: 0 auto; padding: 14px 24px 0; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 24px; }
.brand { display: flex; flex-direction: column; padding-bottom: 12px; margin-right: auto; }
.brand-title { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
.brand-sub { font-size: 13px; color: #c5d4e8; }
.tabs { display: flex; gap: 4px; }
.tab { background: transparent; border: 0; color: #d6e2f1; padding: 10px 16px 12px; font-weight: 600; cursor: pointer; border-radius: 8px 8px 0 0; }
.tab:hover { color: #fff; background: var(--navy-2); }
.tab[aria-selected="true"] { background: var(--page); color: var(--ink); }
.freshness { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #c5d4e8; padding-bottom: 12px; }
.btn-on-dark { background: transparent; border: 1px solid #6f87ab; color: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-on-dark:hover { background: var(--navy-2); }
.btn-on-dark[disabled] { opacity: .6; cursor: default; }

/* ---------- Layout ---------- */
main { max-width: 1480px; margin: 0 auto; padding: 16px 24px 48px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-pad { padding: 18px 20px; }
.card h2 { font-size: 16px; margin: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 16px 20px 10px; }
.card-head p { margin: 2px 0 0; color: var(--ink-3); font-size: 13px; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.grid-main { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); align-items: start; }
.stack > * + * { margin-top: 16px; }

/* ---------- Filters ---------- */
.filters { position: sticky; top: 0; z-index: 20; background: var(--page); padding: 10px 0 12px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.more-row { margin-top: 10px; }
.more-btn { height: 36px; align-self: flex-end; }
.filter-row { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; }
.filters-toggle { display: none; width: 100%; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; border: 1px solid var(--field-border); border-radius: 8px; background: var(--surface); cursor: pointer; text-align: left; }
.filters-summary { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; color: var(--ink); }
.filters-action { color: var(--primary); font-weight: 700; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > span { font-size: 14px; font-weight: 600; color: var(--ink-2); }
select, input[type="search"] { height: 36px; border: 1px solid var(--field-border); border-radius: 6px; background: var(--surface); padding: 0 10px; max-width: 100%; }
select { padding-right: 28px; }
input[type="search"] { width: 230px; }
.seg { display: inline-flex; border: 1px solid var(--field-border); border-radius: 6px; overflow: hidden; background: var(--surface); height: 36px; }
.seg button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 0 11px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--ink-2); border-right: 1px solid var(--line); white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); font-weight: 600; }
.chip-toggle { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 11px; border: 1px solid var(--field-border); border-radius: 18px; background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.seg .dot { width: 10px; height: 10px; border-radius: 3px; }
.chip-toggle .dot { width: 10px; height: 10px; border-radius: 3px; }
.chip-toggle[aria-pressed="false"] { opacity: .55; border-style: dashed; }
.chip-toggle[aria-pressed="false"] .dot { background: transparent !important; border: 2px solid var(--field-border); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.active-filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--primary-soft); color: var(--ink); border-radius: 14px; padding: 3px 4px 3px 10px; font-weight: 500; }
.pill button { border: 0; background: transparent; cursor: pointer; width: 24px; height: 24px; border-radius: 50%; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.pill .icon { width: 14px; height: 14px; }
.pill button:hover { background: var(--surface); }
.link-btn { border: 0; background: none; color: var(--primary); cursor: pointer; padding: 0; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border: 1px solid var(--field-border); border-radius: 6px; background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink-2); white-space: nowrap; }
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn-primary:hover { background: var(--primary-hover); color: var(--primary-ink); }

.banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--primary-soft); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 16px; font-size: 14px; }
.banner .icon { color: var(--primary); width: 18px; height: 18px; align-self: flex-start; margin-top: 1px; }
.banner-text { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }

/* ---------- Summary strip ---------- */
.summary { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin-bottom: 16px; }
.stat { padding: 16px 20px; min-width: 0; text-align: left; border: 0; background: transparent; font: inherit; color: inherit; }
.stat.clickable { cursor: pointer; display: flex; flex-direction: column; justify-content: flex-start; }
.stat.clickable:hover { background: var(--surface-2); }
.stat.clickable:hover .value { color: var(--primary); }
.stat + .stat { border-left: 1px solid var(--line); }
.stat .label { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.stat .value { font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .sub { font-size: 13px; color: var(--ink-3); margin-top: 2px; }

/* ---------- Bars ---------- */
.hbars { padding: 4px 20px 18px; }
.hbar { display: grid; grid-template-columns: 190px minmax(0, 1fr) 64px; gap: 10px; align-items: center; padding: 4px 0; border-radius: 6px; cursor: pointer; background: none; border: 0; width: 100%; text-align: left; }
.hbar:hover .hbar-label { color: var(--primary); text-decoration: underline; }
.hbar[aria-pressed="true"] .hbar-label { font-weight: 700; color: var(--primary); }
.hbar-label { font-size: 14px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar-track { height: 14px; display: flex; gap: 2px; position: relative; }
.hbars.people .hbar { grid-template-columns: minmax(150px, 240px) minmax(0, 1fr) 40px; }
.hbars.after { border-top: 1px solid var(--line); margin: 0 20px; padding: 8px 0 14px; }
.hbars.after .hbar { grid-template-columns: 190px minmax(0, 1fr) 64px; }
.hbar-note { font-size: 13px; color: var(--ink-3); }
.hbar-value.zero { color: var(--ink-3); font-weight: 500; }
.avg-line { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 2px dashed var(--ink-3); transform: translateX(-1px); pointer-events: none; }
.swatch-line { display: inline-block; width: 0; height: 12px; border-left: 2px dashed var(--ink-3); margin: 0 4px; }
.chart-legend { padding: 0 20px 4px; }
.card-foot { margin: 0; padding: 0 20px 16px; font-size: 13px; color: var(--ink-3); }
.seg-fill { height: 100%; min-width: 0; }
.seg-fill:first-child { border-radius: 4px 0 0 4px; }
.seg-fill:last-child { border-radius: 0 4px 4px 0; }
.seg-fill:only-child { border-radius: 0 4px 4px 0; }
.hbar-value { font-size: 14px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.mini-bar { display: flex; gap: 2px; height: 10px; min-width: 80px; position: relative; }
td.bar-cell { min-width: 100px; vertical-align: middle; }
td.bar-cell.wide { min-width: 120px; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; border-top: 1px solid var(--line); scrollbar-color: var(--line-strong) transparent; scrollbar-width: thin; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 9px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
thead th { position: sticky; top: 0; background: var(--surface-2); font-size: 13px; color: var(--ink-2); font-weight: 600; white-space: nowrap; z-index: 1; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--primary); }
.th-inner { display: inline-flex; align-items: center; gap: 2px; }
th.num .th-inner { justify-content: flex-end; }
th .arrow { display: inline-flex; width: 14px; color: var(--primary); }
th .arrow .icon { width: 14px; height: 14px; stroke-width: 2.5; }
th .rank { font-size: 10px; vertical-align: super; color: var(--primary); }
tbody tr:hover td { background: var(--surface-2); }
tbody tr.clickable { cursor: pointer; }
tr.group-row td { background: var(--surface-3); font-weight: 700; cursor: pointer; }
tr.group-row:hover td { background: var(--surface-3); }
tr.group-row .caret { display: inline-flex; width: 20px; transition: transform .15s ease-out; }
tr.group-row.collapsed .caret { transform: rotate(-90deg); }
tr.total-row td { font-weight: 700; background: var(--surface-2); border-bottom: 0; }
tbody tr.current td, tbody tr.current:hover td { background: var(--primary-soft); }
tbody tr.current td:first-child { box-shadow: inset 3px 0 0 var(--primary); }
td.title-cell { min-width: 230px; max-width: 300px; }
td .sub { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
td.title-cell .sub { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
td.tags-cell { min-width: 70px; }
td.office-cell { min-width: 110px; max-width: 150px; }
td.lead-cell { min-width: 130px; max-width: 180px; }
td.award-cell { min-width: 130px; max-width: 180px; }
td.award-cell .t1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td.title-cell .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pr-link { font-weight: 600; white-space: nowrap; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 10px; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; margin: 1px 2px 1px 0; }
.stage { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
.stage .swatch { border-radius: 50%; }
.person-btn { border: 0; background: none; padding: 0; color: var(--primary); cursor: pointer; font-weight: 600; text-align: left; }
.person-btn:hover { text-decoration: underline; }
.table-foot { padding: 12px 20px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 13px; color: var(--ink-3); }
.toolbar { display: flex; gap: 10px 14px; align-items: flex-end; flex-wrap: wrap; padding: 0 20px 14px; }
.toolbar .spacer { flex: 1; }
.empty { padding: 32px 20px; text-align: center; color: var(--ink-3); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty p { margin: 0; }
.check { display: inline-flex; align-items: center; gap: 8px; height: 36px; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.rank-cell { color: var(--ink-3); width: 36px; }
.you { font-size: 11px; font-weight: 700; background: var(--warning-soft); color: var(--warning); border-radius: 8px; padding: 0 6px; margin-left: 6px; }

/* ---------- Detail drawer ---------- */
.drawer-backdrop { position: fixed; inset: 0; background: rgba(10, 16, 28, .45); z-index: 50; display: flex; justify-content: flex-end; }
.drawer { width: min(640px, 100%); height: 100%; background: var(--surface); box-shadow: var(--shadow-lg); overflow-y: auto; padding: 20px 24px 40px; }
.drawer-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.drawer h2 { margin: 4px 0 6px; font-size: 19px; line-height: 1.3; }
.close-btn { border: 1px solid var(--line-strong); background: var(--surface); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; flex: none; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); }
.close-btn:hover { color: var(--ink); border-color: var(--field-border); }
.pr-link .icon { width: 14px; height: 14px; margin-left: 4px; }
.btn .icon { width: 16px; height: 16px; }
.dl { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 8px 14px; margin: 16px 0 0; font-size: 14px; }
.dl dt { color: var(--ink-3); font-weight: 600; }
.dl dd { margin: 0; overflow-wrap: anywhere; }
.section-title { font-size: 14px; font-weight: 700; color: var(--ink); margin: 22px 0 0; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.subprojects { margin: 10px 0 0; padding-left: 22px; font-size: 14px; }
.subprojects li + li { margin-top: 4px; }
.tag.team-bm { background: var(--primary-soft); color: var(--primary); }
.money-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.money-row div { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; }
.money-row .label { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.money-row .value { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- Tooltip ---------- */
.tooltip { position: fixed; z-index: 60; pointer-events: none; background: var(--surface); border: 1px solid var(--line-strong); box-shadow: var(--shadow-lg); border-radius: 8px; padding: 8px 10px; font-size: 13px; min-width: 160px; }
.tooltip .tt-title { font-weight: 700; margin-bottom: 4px; }
.tooltip .tt-row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tooltip .tt-row span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 70; box-shadow: var(--shadow-lg); }
.footnote { font-size: 13px; color: var(--ink-3); margin-top: 20px; line-height: 1.6; }

/* ---------- Responsive ---------- */
@media (max-width: 1200px) {
  .grid-main { grid-template-columns: minmax(0, 1fr); }
  .stat { padding: 14px 16px; }
  .stat .value { font-size: 24px; }
}
@media (max-width: 900px) {
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .summary .stat { border-left: 0; border-top: 1px solid var(--line); padding: 12px 14px; }
  .summary .stat:first-child { grid-column: 1 / -1; border-top: 0; }
  .summary .stat:nth-child(odd):not(:first-child) { border-left: 1px solid var(--line); }
  .grid-2 { grid-template-columns: minmax(0, 1fr); }
  .hbar, .hbars.after .hbar { grid-template-columns: 130px minmax(0, 1fr) 52px; }
  .hbars.people .hbar { grid-template-columns: minmax(110px, 150px) minmax(0, 1fr) 36px; }
}
@media (max-width: 640px) {
  .topbar-inner, main { padding-left: 16px; padding-right: 16px; }
  .stat .value { font-size: 22px; }
  .hide-sm { display: none; }
  .tabs { width: 100%; }
  .tab { flex: 1; padding: 10px 6px 12px; }
  .filters { position: static; }
  .filters-toggle { display: flex; }
  .filters .filter-row, .filters .active-filters { display: none; }
  .filters.open .filter-row, .filters.open .active-filters { display: flex; }
  .filters.open .filter-row { margin-top: 12px; }
  .field, .field select, input[type="search"] { width: 100%; }
  .filter-row > * { flex: 1 1 100%; }
