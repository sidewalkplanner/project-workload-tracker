<script>
/* ==========================================================================
   App shell, filters and the three views: Overview, Projects, Workload.
   ========================================================================== */
var VIEWS = [
  { key: 'overview', label: 'Overview' },
  { key: 'projects', label: 'Projects' },
  { key: 'workload', label: 'Workload' }
];

var PROJECT_COLUMNS = [
  { key: 'pr', label: 'PR' },
  { key: 'title', label: 'Title · building' },
  { key: 'program', label: 'Program' },
  { key: 'stageOrder', label: 'EASi status' },
  { key: 'office', label: 'Field office' },
  { key: 'leadName', label: 'Project lead' },
  { key: 'committed', label: 'Committed', num: true },
  { key: 'remaining', label: 'Unexpended', num: true },
  { key: 'executed', label: 'Award', dir: -1 }
];
var PROJECT_ACCESSORS = {
  program: function (p) { return programLabels(p).join('/'); },
  office: function (p) { return officeLabel(p); },
  leadName: function (p) { return peopleNames(p.lead); }
};
/** The CSV export: everything, at full precision, whatever the table shows. */
var PROJECT_CSV = [
  ['PR', function (p) { return p.pr; }], ['Title', function (p) { return p.title; }],
  ['Projects', function (p) { return unitsOf(p); }], ['Sub-projects', function (p) { return (p.subprojects || []).map(function (s) { return s.id + ' ' + s.title; }).join('; '); }], ['Program', function (p) { return programLabels(p).join(' / '); }],
  ['EASi status', function (p) { return stageOf(p).label; }], ['Field office', function (p) { return officeLabel(p); }], ['Service center', function (p) { return p.serviceCenters.join('; '); }],
  ['Building', function (p) { return p.buildings.join(' '); }], ['Building names', function (p) { return p.buildingNames.join('; '); }],
  ['Project lead', function (p) { return peopleNames(p.lead); }], ['COR', function (p) { return peopleNames(p.cor); }], ['Requestor', function (p) { return peopleNames(p.requestor); }],
  ['Committed', function (p) { return p.committed; }], ['Obligated', function (p) { return p.obligated; }], ['Expended', function (p) { return p.expended; }], ['Unexpended', function (p) { return p.remaining; }],
  ['PR fiscal year', function (p) { return p.fy || ''; }], ['Awarded', function (p) { return p.executed; }], ['Vendor', function (p) { return p.vendor; }], ['Award number', function (p) { return p.awardNumber; }],
  ['Acquisition status', function (p) { return p.acquisitionStatus; }], ['PR status', function (p) { return p.prStatus; }],
  ['Contracting officer', function (p) { return peopleNames(p.co); }], ['Contract specialist', function (p) { return peopleNames(p.cs); }], ['Building manager', function (p) { return peopleNames(p.buildingManager); }],
  ['Service contract', function (p) { return p.service; }], ['EASi link', function (p) { return p.link; }]
];
var GROUPS = [
  { key: '', label: 'No grouping' },
  { key: 'office', label: 'Field office' },
  { key: 'lead', label: 'Project lead' },
  { key: 'cor', label: 'COR' },
  { key: 'requestor', label: 'Requestor' },
  { key: 'stage', label: 'EASi status' },
  { key: 'program', label: 'Program' },
  { key: 'building', label: 'Building' },
  { key: 'fy', label: 'Fiscal year' }
];

// ---------------------------------------------------------------------------
// Start-up
// ---------------------------------------------------------------------------
function start() {
  applyRoute(BOOT.route || {});
  load(false);
}

function load(refresh) {
  var fn = refresh ? 'apiRefresh' : 'apiLoad';
  if (!S.data) renderState('Loading the Zone 5 pipeline…', 'This can take up to half a minute the first time each morning, while the EASi report is read.', true);
  google.script.run
    .withSuccessHandler(function (json) {
      var res = JSON.parse(json);
      var first = !S.data;
      S.data = res.data;
      S.user = res.user;
      prepareData(S.data);
      if (first) applyDefaultsForUser();
      render();
      if (refresh) toast('Refreshed from the EASi report.');
    })
    .withFailureHandler(function (err) {
      if (S.data) { toast('Could not refresh: ' + (err && err.message || err)); render(); return; }
      renderState('The tracker could not load', (err && err.message) || String(err), false);
    })[fn]();
}

function applyRoute(r) {
  var f = S.filters;
  if (r.view && VIEWS.some(function (v) { return v.key === r.view; })) S.view = r.view;
  if (r.office) f.office = r.office;
  if (r.sc) f.sc = r.sc;
  if (r.program) {
    var list = r.program.toUpperCase().split(/[ ,]+/).map(function (p) { return p === 'OTHER' ? 'Other' : p; })
      .filter(function (p) { return PROGRAM_LABELS.indexOf(p) !== -1; });
    if (list.length) f.programs = list;
  }
  if (r.status && STATUS_OPTIONS.some(function (s) { return s.key === r.status; })) f.status = r.status;
  if (r.fy && /^\d{4}$/.test(r.fy)) f.fy = r.fy;
  if (r.type && TYPE_OPTIONS.some(function (t) { return t.key === r.type; })) f.type = r.type;
  if (r.q) f.q = r.q;
  if (r.role) S.workload.role = r.role;
  if (r.person) f.person = { role: r.role || 'lead', email: r.person.toLowerCase() };
  if (r.group) S.projects.group = r.group;
  S.routeHadScope = !!(r.office || r.sc);
}

/** Field Office Managers open on their office, Service Center Directors on their service center. */
function applyDefaultsForUser() {
  var f = S.filters;
  if (f.office && !S.data.offices.some(function (o) { return o.name === f.office; })) f.office = '';
  if (f.sc && !S.data.serviceCenters.some(function (s) { return s.name === f.sc; })) f.sc = '';
  if (!S.data.roles.some(function (r) { return r.key === S.workload.role; })) S.workload.role = 'lead';
  if (S.routeHadScope || !S.user) return;
  var u = S.user;
  var lead = u.email && S.homeOffice.lead ? S.homeOffice.lead[u.email] : '';
  var officeOf = function (name) { return S.data.offices.filter(function (o) { return o.name === name; })[0]; };
  // Field Office Managers, then Service Center Directors, then the org code in the person's
  // GSA profile (as in the NEH BA61 Project Portal), then where they lead the most projects.
  if (u.manages.length === 1) S.scopeNote = { kind: 'manager', office: u.manages[0] };
  else if (u.directs.length === 1) S.scopeNote = { kind: 'director', sc: u.directs[0] };
  else if (u.orgOffice && officeOf(u.orgOffice)) S.scopeNote = { kind: 'org', office: u.orgOffice };
  else if (u.orgSc) S.scopeNote = { kind: 'org', sc: u.orgSc };
  else if (lead && officeOf(lead)) S.scopeNote = { kind: 'lead', office: lead };
  else return;
  if (S.scopeNote.office) { f.office = S.scopeNote.office; f.sc = officeOf(f.office).serviceCenter; }
  else f.sc = S.scopeNote.sc;
}

function syncUrl() {
  try {
    var f = S.filters, p = {};
    if (S.view !== 'overview') p.view = S.view;
    if (f.office) p.office = f.office;
    else if (f.sc) p.sc = f.sc;
    if (f.programs.length < PROGRAM_LABELS.length) p.program = f.programs.join(',');
    if (f.status !== 'open') p.status = f.status;
    if (f.fy) p.fy = f.fy;
    if (f.type !== 'projects') p.type = f.type;
    if (f.q) p.q = f.q;
    if (f.person) { p.person = f.person.email; p.role = f.person.role; }
    else if (S.view === 'workload' && S.workload.role !== 'lead') p.role = S.workload.role;
    if (S.view === 'projects' && S.projects.group) p.group = S.projects.group;
    google.script.history.replace(null, p);
  } catch (e) { /* outside Apps Script */ }
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function renderState(title, message, busy) {
  var app = clear(document.getElementById('app'));
  app.appendChild(h('div', { class: 'state' }, busy ? h('span', { class: 'spinner' }) : null, h('h2', null, title), h('p', null, message)));
}

function render() {
  hideTooltip();
  var app = clear(document.getElementById('app'));
  app.appendChild(topBar());
  var main = h('main', { id: 'main', tabindex: '-1' });
  main.appendChild(filterBar());
  var banner = scopeBanner();
  if (banner) main.appendChild(banner);
  if (S.view === 'overview') main.appendChild(overviewView());
  else if (S.view === 'projects') main.appendChild(projectsView());
  else main.appendChild(workloadView());
  main.appendChild(footnote());
  app.appendChild(main);
  syncUrl();
}

function rerender() {
  var y = window.scrollY;
  render();
  window.scrollTo(0, y);
}

function go(view) {
  S.view = view;
  render();
  window.scrollTo(0, 0);
}

function topBar() {
  var d = S.data;
  var refreshBtn = h('button', { class: 'btn-on-dark', type: 'button', title: 'Read the EASi report again' }, 'Refresh');
  refreshBtn.addEventListener('click', function () { refreshBtn.disabled = true; refreshBtn.textContent = 'Refreshing…'; load(true); });
  var tabs = h('div', { class: 'tabs', role: 'tablist', 'aria-label': 'Views' }, VIEWS.map(function (v) {
    return h('button', { class: 'tab', role: 'tab', type: 'button', 'aria-selected': String(S.view === v.key), onClick: function () { go(v.key); } }, v.label);
  }));
  return h('header', { class: 'topbar' }, h('div', { class: 'topbar-inner' },
    h('div', { class: 'brand' },
      h('span', { class: 'brand-title' }, 'Zone ' + d.zone + ' Project Workload'),
      h('span', { class: 'brand-sub' }, 'EASi pipeline · ' + d.serviceCenters.map(function (s) { return s.short; }).join(' & ') + ' · BA61, BA80, BA54')),
    h('div', { class: 'freshness' },
      h('span', null, 'EASi report ' + (d.generatedAt ? fmtDateTime(d.generatedAt) : 'date unknown')),
      refreshBtn),
    tabs));
}

function scopeBanner() {
  var n = S.scopeNote;
  if (!n || !S.user) return null;
  var f = S.filters;
  if (n.office ? f.office !== n.office : (f.sc !== n.sc || f.office)) return null;
  var why = n.kind === 'manager' ? ', the field office you manage.'
    : n.kind === 'director' ? ', the service center you lead.'
    : n.kind === 'org' ? (n.office ? ', your field office' : ', your service center') + (S.user.orgCode ? ' (' + S.user.orgCode + ' in your GSA profile).' : '.')
    : ', where you lead the most projects.';
  return h('div', { class: 'banner', role: 'note' }, icon('info'),
    h('div', { class: 'banner-text' },
      h('span', null, 'Showing ', h('strong', null, n.office ? officeShort(n.office) : n.sc.replace(/ Service Center$/, '')), why),
      h('button', { class: 'link-btn', type: 'button', onClick: function () { f.office = ''; f.sc = ''; S.scopeNote = ''; rerender(); } }, 'Show all of Zone ' + S.data.zone)));
}

function filterBar() {
  var f = S.filters, d = S.data;
  var scSel = h('select', { 'aria-label': 'Service center' }, h('option', { value: '' }, 'All service centers'),
    d.serviceCenters.map(function (s) { return h('option', { value: s.name, selected: f.sc === s.name && !f.office }, s.short); }));
  scSel.addEventListener('change', function () { f.sc = scSel.value; f.office = ''; rerender(); });
  var foSel = h('select', { 'aria-label': 'Field office' }, h('option', { value: '' }, 'All field offices'),
    d.serviceCenters.map(function (sc) {
      return h('optgroup', { label: sc.short }, d.offices.filter(function (o) { return o.serviceCenter === sc.name && (!f.sc || f.sc === sc.name || f.office === o.name); })
        .map(function (o) { return h('option', { value: o.name, selected: f.office === o.name }, o.short); }));
    }));
  foSel.addEventListener('change', function () {
    f.office = foSel.value;
    var o = d.offices.filter(function (x) { return x.name === f.office; })[0];
    if (o) f.sc = o.serviceCenter;
    rerender();
  });
  var programs = h('div', { class: 'chips', role: 'group', 'aria-label': 'Programs' }, PROGRAM_LABELS.map(function (l) {
    var on = f.programs.indexOf(l) !== -1;
    return h('button', {
      class: 'chip-toggle', type: 'button', 'aria-pressed': String(on),
      title: l === 'Other' ? 'Other budget activities, or none listed' : (d.programs.filter(function (p) { return p.label === l; })[0] || {}).name,
      onClick: function () {
        var list = f.programs.slice();
        if (on) list = list.filter(function (x) { return x !== l; }); else list.push(l);
        f.programs = list.length ? PROGRAM_LABELS.filter(function (x) { return list.indexOf(x) !== -1; }) : PROGRAM_LABELS.slice();
        rerender();
      }
    }, h('span', { class: 'dot', style: { background: PROGRAM_COLORS[l] } }), l);
  }));
  var status = h('div', { class: 'seg', role: 'group', 'aria-label': 'EASi status' }, STATUS_OPTIONS.map(function (s) {
    return h('button', { type: 'button', 'aria-pressed': String(!f.stage && f.status === s.key), title: s.help || null, onClick: function () { f.status = s.key; f.stage = ''; rerender(); } }, s.label);
  }));
  var years = {};
  d.prs.forEach(function (p) { if (p.fy) years[p.fy] = true; });
  var fySel = h('select', { 'aria-label': 'Fiscal year' }, h('option', { value: '' }, 'All years'),
    Object.keys(years).sort().reverse().map(function (y) { return h('option', { value: y, selected: String(f.fy) === y }, 'FY' + y.slice(2)); }));
  fySel.addEventListener('change', function () { f.fy = fySel.value; rerender(); });
  var typeSel = h('select', { 'aria-label': 'Type' }, TYPE_OPTIONS.map(function (t) { return h('option', { value: t.key, selected: f.type === t.key }, t.label); }));
  typeSel.addEventListener('change', function () { f.type = typeSel.value; rerender(); });
  var search = h('input', { type: 'search', placeholder: 'PR, title, building, person, vendor…', value: f.q, 'aria-label': 'Search' });
  var timer = null;
  search.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      f.q = search.value;
      rerender();
      var again = document.querySelector('input[type="search"]');
      if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    }, 250);
  });

  var active = [];
  if (f.person) {
    var role = d.roles.filter(function (r) { return r.key === f.person.role; })[0] || { short: f.person.role };
    active.push(pill(role.short + ': ' + (f.person.email ? personName(f.person.email) : '(none)'), function () { f.person = null; }));
  }
  if (f.stage) active.push(pill('Status: ' + S.stageIndex[f.stage].label, function () { f.stage = ''; }));
  var mineBtn = null;
  if (S.user && S.user.email && !f.person) {
    var myRole = null;
    ['lead', 'buildingManager', 'programManager', 'co', 'cs'].some(function (r) {
      if (d.prs.some(function (p) { return (p[r] || []).indexOf(S.user.email) !== -1; })) { myRole = r; return true; }
      return false;
    });
    if (myRole) mineBtn = h('button', { class: 'link-btn', type: 'button', onClick: function () { f.person = { role: myRole, email: S.user.email }; rerender(); } }, 'My projects');
  }
  var any = f.sc || f.office || f.programs.length < PROGRAM_LABELS.length || f.status !== 'open' || f.stage || f.fy || f.q || f.person || f.type !== 'projects';
  var reset = any ? h('button', { class: 'link-btn', type: 'button', onClick: resetFilters }, 'Reset filters') : null;

  // On a phone the filters fold into one line that says what is showing.
  var summary = [scopeName(), statusLabel(), f.programs.length < PROGRAM_LABELS.length ? f.programs.join(', ') : 'all programs',
    f.fy ? 'FY' + String(f.fy).slice(2) : '', f.type !== 'projects' ? TYPE_OPTIONS.filter(function (t) { return t.key === f.type; })[0].label.toLowerCase() : '', f.q ? '“' + f.q + '”' : '']
    .filter(Boolean).join(' · ');
  var toggle = h('button', { class: 'filters-toggle', type: 'button', 'aria-expanded': String(!!S.filtersOpen), 'aria-controls': 'filter-row' },
    icon('filter'), h('span', { class: 'filters-summary' }, summary), h('span', { class: 'filters-action' }, S.filtersOpen ? 'Done' : 'Filters'));
  toggle.addEventListener('click', function () { S.filtersOpen = !S.filtersOpen; rerender(); });

  return h('section', { class: 'filters' + (S.filtersOpen ? ' open' : ''), 'aria-label': 'Filters' },
    toggle,
    h('div', { class: 'filter-row', id: 'filter-row' },
      h('label', { class: 'field' }, h('span', null, 'Service center'), scSel),
      h('label', { class: 'field' }, h('span', null, 'Field office'), foSel),
      h('div', { class: 'field' }, h('span', null, 'Program'), programs),
      h('div', { class: 'field' }, h('span', null, 'EASi status'), status),
      h('label', { class: 'field' }, h('span', null, 'PR fiscal year'), fySel),
      h('label', { class: 'field', title: 'Service contracts (custodial, O&M, snow removal, utilities, option years) are not projects and are hidden unless you ask for them.' }, h('span', null, 'Type'), typeSel),
      h('label', { class: 'field' }, h('span', null, 'Search'), search)),
    (active.length || mineBtn || reset) ? h('div', { class: 'active-filters' }, active, mineBtn, reset) : null);
}

function pill(text, onRemove) {
  return h('span', { class: 'pill' }, text, h('button', { type: 'button', 'aria-label': 'Remove ' + text, onClick: function () { onRemove(); rerender(); } }, icon('close')));
}

function resetFilters() {
  S.filters = { sc: '', office: '', programs: PROGRAM_LABELS.slice(), status: 'open', stage: '', fy: '', q: '', person: null, type: 'projects' };
  S.scopeNote = '';
  rerender();
}

function scopeName() {
  var f = S.filters;
  if (f.office) return officeShort(f.office);
  if (f.sc) return f.sc.replace(/ Service Center$/, '');
  return 'Zone ' + S.data.zone;
}

// ---------------------------------------------------------------------------
// Overview
// ---------------------------------------------------------------------------
function overviewView() {
  var list = filtered();
  var t = totalsOf(list);
  var wrap = h('div', { class: 'stack' });
  var leads = workloadRows(list, 'lead', false).filter(function (r) { return r.email; });
  leads.sort(function (a, b) { return b.count - a.count || a.name.localeCompare(b.name); });
  var avg = leads.length ? leads.reduce(function (s, r) { return s + r.count; }, 0) / leads.length : 0;
  var preawardDollars = list.filter(function (p) { return stageOf(p).group === 'preaward'; }).reduce(function (s, p) { return s + p.committed; }, 0);
  var withContracting = countOf(list.filter(function (p) { return p.stage === 'assigned' || p.stage === 'solicitation' || p.stage === 'drafting'; }));
  var top = leads[0];

  wrap.appendChild(h('section', { class: 'card summary', 'aria-label': 'Summary' },
    stat(S.filters.status === 'all' && !S.filters.stage ? 'Projects' : statusLabel() + ' projects', fmtInt(t.count), scopeName()),
    stat('Pre-award', fmtInt(t.preaward), t.preaward ? fmtMoneyShort(preawardDollars) + ' committed · ' + fmtInt(withContracting) + ' with contracting' : 'none waiting'),
    stat('Awarded · open', fmtInt(t.awarded), fmtMoneyShort(t.remaining) + ' not yet expended'),
    stat('Obligated', fmtMoneyShort(t.obligated), fmtMoneyShort(t.expendedAmt) + ' expended so far'),
    stat('Project leads', fmtInt(leads.length), leads.length ? avg.toFixed(1) + ' projects each · most: ' + top.name + ' (' + top.count + ')' : 'none')));

  wrap.appendChild(h('div', { class: 'grid grid-main' },
    topPeopleCard(leads, avg),
    h('div', { class: 'stack' }, pipelineCard(), programCard(list))));
  wrap.appendChild(officeCard());
  return wrap;
}

function statusLabel() {
  var f = S.filters;
  if (f.stage) return S.stageIndex[f.stage].short;
  return STATUS_OPTIONS.filter(function (s) { return s.key === f.status; })[0].label;
}

function stat(label, value, sub) {
  return h('div', { class: 'stat' }, h('div', { class: 'label' }, label), h('div', { class: 'value' }, value), h('div', { class: 'sub' }, sub));
}

/** Everyone with projects, busiest first, against the average for the scope. */
function topPeopleCard(leads, avg) {
  var top = leads.slice(0, 15);
  var max = top.length ? top[0].count : 1;
  var all = h('button', { class: 'btn', type: 'button', onClick: function () { S.workload.role = 'lead'; go('workload'); } }, 'Everyone', icon('arrow'));
  return h('section', { class: 'card' },
    h('div', { class: 'card-head' }, h('div', null, h('h2', null, 'Who has the most projects'),
      h('p', null, 'Project leads in ' + scopeName() + ': the COR, or the requestor until a COR is named. Click a name for their projects.')), all),
    top.length ? [
      h('div', { class: 'chart-legend' }, groupLegend('Average ' + avg.toFixed(1))),
      h('div', { class: 'hbars people' }, top.map(function (r) {
        var b = h('button', { class: 'hbar', type: 'button', 'aria-label': r.name + ': ' + r.count + ' projects, ' + r.preaward + ' pre-award' },
          h('span', { class: 'hbar-label', title: r.name + (r.office ? ' · ' + officeShort(r.office) : '') }, r.name,
            r.office && !S.filters.office ? h('span', { class: 'muted' }, ' · ' + officeShort(r.office)) : null),
          stackedBar(groupSegments(r), max, 'hbar-track', avg),
          h('span', { class: 'hbar-value' }, fmtInt(r.count)));
        b.addEventListener('click', function () { showPerson('lead', r.email); });
        return withTooltip(b, r.name, function () {
          return [{ label: 'Pre-award', value: fmtInt(r.preaward), color: GROUP_COLORS.preaward }, { label: 'Awarded · open', value: fmtInt(r.awarded), color: GROUP_COLORS.awarded },
            r.expended ? { label: 'Fully expended', value: fmtInt(r.expended), color: GROUP_COLORS.closed } : null, { label: 'Unexpended', value: fmtMoney(r.remaining) }].filter(Boolean);
        });
      })),
      leads.length > top.length ? h('p', { class: 'card-foot' }, (leads.length - top.length) + ' more ' + (leads.length - top.length === 1 ? 'person' : 'people') + ' on the Workload tab.') : null
    ] : emptyState());
}

/** The pre-award stages, scaled among themselves so a few hundred awarded PRs don't flatten them. */
function pipelineCard() {
  var list = filtered({ status: true });
  var counts = {}, dollars = {};
  list.forEach(function (p) { counts[p.stage] = (counts[p.stage] || 0) + unitsOf(p); dollars[p.stage] = (dollars[p.stage] || 0) + p.committed; });
  var pre = S.data.stages.filter(function (s) { return s.group === 'preaward'; });
  var max = Math.max.apply(null, pre.map(function (s) { return counts[s.key] || 0; }).concat([1]));
  var f = S.filters;
  var open = function (key) { f.stage = f.stage === key ? '' : key; S.view = 'projects'; render(); window.scrollTo(0, 0); };
  var row = function (s, bar) {
    var n = counts[s.key] || 0;
    var b = h('button', { class: 'hbar', type: 'button', 'aria-pressed': String(f.stage === s.key), 'aria-label': s.label + ': ' + n + ' PRs. Show them.' },
      h('span', { class: 'hbar-label' }, s.short),
      bar ? stackedBar([{ value: n, color: GROUP_COLORS[s.group] }], max) : h('span', { class: 'hbar-note' }, fmtMoneyShort(dollars[s.key] || 0) + ' committed'),
      h('span', { class: 'hbar-value' + (n ? '' : ' zero') }, fmtInt(n)));
    b.addEventListener('click', function () { open(s.key); });

  list.forEach(function (p) {
    if (key === 'office') (p.offices.length ? p.offices : ['']).forEach(function (o) { put('o:' + o, o ? officeShort(o) : 'Service center level (no building)', p, o || '~'); });
    else if (key === 'lead' || key === 'cor' || key === 'requestor') (p[key].length ? p[key] : ['']).forEach(function (e) { put(key + ':' + e, e ? personName(e) : '(none in EASi)', p, e ? personName(e) : '~'); });

    rows.length ? h('div', { class: 'table-wrap' }, h('table', null, thead, tbody)) : emptyState());
}

// ---------------------------------------------------------------------------
// Project detail
// ---------------------------------------------------------------------------
function openDrawer(p) {
  hideTooltip();
  var st = stageOf(p);
  var people = function (list) { return list.length ? list.map(function (e) { return personName(e) + ' (' + e + ')'; }).join(', ') : '–'; };
  var item = function (label, value) { return [h('dt', null, label), h('dd', null, value === '' || value === null || value === undefined ? '–' : value)]; };
  var close = h('button', { class: 'close-btn', type: 'button', 'aria-label': 'Close' }, icon('close'));
  var drawer = h('div', { class: 'drawer', role: 'dialog', 'aria-modal': 'true', 'aria-label': p.pr },
    h('div', { class: 'drawer-head' }, h('div', null,
      h('a', { class: 'pr-link', href: p.link, target: '_blank', rel: 'noopener' }, p.pr + ' · open in EASi', icon('external')),
      h('h2', null, p.title),
      h('div', null, programTags(p), ' ', stageBadge(p), p.service ? [' ', h('span', { class: 'tag' }, 'Service contract')] : null)), close),
    h('div', { class: 'money-row' },
      h('div', null, h('div', { class: 'label' }, 'Committed'), h('div', { class: 'value' }, fmtMoney(p.committed))),
      h('div', null, h('div', { class: 'label' }, 'Obligated'), h('div', { class: 'value' }, fmtMoney(p.obligated))),
      h('div', null, h('div', { class: 'label' }, 'Expended'), h('div', { class: 'value' }, fmtMoney(p.expended))),
      h('div', null, h('div', { class: 'label' }, 'Unexpended'), h('div', { class: 'value' }, fmtMoney(p.remaining)))),
    p.subprojects && p.subprojects.length ? [
      h('div', { class: 'section-title' }, p.subprojects.length + ' projects on this PR'),
      h('p', { class: 'small muted', style: { margin: '8px 0 0' } }, 'One award funds all of them, so EASi shows one PR. The tracker counts each project.'),
      h('ol', { class: 'subprojects' }, p.subprojects.map(function (s) { return h('li', null, h('strong', null, s.id), ' ', s.title); }))
    ] : null,
    h('div', { class: 'section-title' }, 'EASi status'),
    h('dl', { class: 'dl' },
      item('Where it is', st.label),
      item('PR status', p.prStatus),
      item('Acquisition status', p.acquisitionStatus),
      item('Solicitation status', p.solicitationStatus),
      item('Award status', p.awardStatus),
      p.reviewers.length ? item('Waiting on', people(p.reviewers)) : null,
      item('Award number', p.awardNumber),
      item('Awarded', fmtDate(p.executed)),
      item('Vendor', p.vendor),
      item('Award type', p.awardType),
      item('Category', p.category),
      item('Procurement category', p.procurementCategory),
      p.service ? item('Service contract', p.service + '. Service contracts are hidden unless Type includes them.') : null,
      item('PR fiscal year', p.fy ? 'FY' + p.fy : '')),
    h('div', { class: 'section-title' }, 'Location'),
    h('dl', { class: 'dl' },
      item('Field office', p.offices.join(', ') || '(service center level)'),
      item('Service center', p.serviceCenters.join(', ')),
      item('Buildings', p.buildings.length ? p.buildings.map(function (b, i) { return b + ' · ' + (p.buildingNames[i] || ''); }).join('\n') : ''),
      p.placeNote ? item('Matched by', p.placeNote === 'title' ? 'Building number in the PR title (no building in EASi)' : 'OFM org code (no building in EASi)') : null),
    h('div', { class: 'section-title' }, 'People'),
    h('dl', { class: 'dl' },
      item('COR', people(p.cor)),
      item('Requestor', people(p.requestor)),
      item('Building manager', people(p.buildingManager)),
      item('Program manager', people(p.programManager)),
      item('Contracting officer', people(p.co)),
      item('Contract specialist', people(p.cs))),
    h('div', { class: 'section-title' }, 'Funding'),
    h('dl', { class: 'dl' },
      item('Program codes', p.programs.join(', ') + (p.programFromTitle ? ' (from the PR title; EASi has no program code yet)' : '')),
      item('RWA', p.rwas.join(', ')),
      item('Project codes', p.projectCodes.join(', ')),
      item('BA61 portal number', p.portalNumbers.join(', ')),
      item('Contracting office', p.officeCode),
      p.comments ? item('Comments', p.comments) : null));
  drawer.querySelectorAll('dd').forEach(function (dd) { dd.style.whiteSpace = 'pre-line'; });
  var backdrop = h('div', { class: 'drawer-backdrop' }, drawer);
  var opener = document.activeElement;
  var shut = function () { backdrop.remove(); document.removeEventListener('keydown', onKey); if (opener && opener.focus) opener.focus(); };
  var onKey = function (e) { if (e.key === 'Escape') shut(); };
  close.addEventListener('click', shut);
  backdrop.addEventListener('click', function (e) { if (e.target === backdrop) shut(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(backdrop);
  close.focus();
}

function footnote() {
  var d = S.data, c = d.counts;
  return h('p', { class: 'footnote' },
    'Source: the EASi BA61 Pipeline report (' + fmtInt(c.pipelineRows) + ' PRs nationwide, generated ' + (d.generatedAt ? fmtDateTime(d.generatedAt) : 'date unknown') + '), matched to Zone ' + d.zone +
    ' field offices through the buildings on each PR and the OFM Building Assignments sheet' + (d.directoryUpdated ? ' (updated ' + d.directoryUpdated + ')' : '') + '. ' +
    fmtInt(c.zonePrs) + ' PRs are on Zone ' + d.zone + ' buildings, ' + fmtInt(d.prs.filter(function (p) { return p.service; }).length) + ' of them service contracts (custodial, O&M, snow removal, utilities, option years), which are hidden unless Type includes them. PRs without a building (national contracts, broker leases) are not shown. ' +
    '“Fully expended” means Pegasys shows the whole obligation spent. Snapshot built ' + fmtDateTime(d.builtAt) + '.');
}

window.addEventListener('load', start);
</script>
