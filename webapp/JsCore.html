<script>
/* ==========================================================================
   Core: DOM helpers, formatting, state, filtering and aggregation.
   All data is inserted as text, never as HTML.
   ========================================================================== */
var BOOT = window.__BOOT__ || { app: {}, route: {} };
var PROGRAM_LABELS = ['BA61', 'BA80', 'BA54', 'Other'];
var PROGRAM_COLORS = { BA61: 'var(--ba61)', BA80: 'var(--ba80)', BA54: 'var(--ba54)', Other: 'var(--other)' };
var GROUP_COLORS = { planned: 'var(--planned)', preaward: 'var(--preaward)', awarded: 'var(--awarded)', closed: 'var(--expended)' };
var TYPE_OPTIONS = [
  { key: 'projects', label: 'Projects' },
  { key: 'all', label: 'Projects + service contracts' },
  { key: 'service', label: 'Service contracts' }
];
var STATUS_OPTIONS = [
  { key: 'open', label: 'Open', help: 'Everything not yet paid in full, including planned projects not in EASi yet' },
  { key: 'planned', label: 'Not in EASi yet', help: 'Projects planned or approved in the BA61 portal, the BA54 tracker or the RWA dashboard that have no PR in EASi yet', planned: true },
  { key: 'preaward', label: 'Not awarded yet', help: 'From draft PR through contract being written' },
  { key: 'awarded', label: 'Awarded', help: 'Awarded, with money still to be spent' },
  { key: 'expended', label: 'Paid in full', help: 'Awarded and all obligated money spent (Pegasys)' },
  { key: 'all', label: 'All' }
];
var TEAM_OPTIONS = [
  { key: 'all', label: 'Everyone' },
  { key: 'bm', label: 'Building managers', short: 'Building mgr', help: 'People ServiceNow lists as a contact for a building' },
  { key: 'pm', label: 'Project managers', short: 'Project mgr', help: 'Everyone else assigned to projects' }
];
var GROUP_LABELS = { planned: 'Not in EASi yet', preaward: 'Not awarded yet', awarded: 'Awarded', closed: 'Paid in full' };

/** The planning sheets the snapshot read (BA61 portal, BA54 tracker): their projects with no PR in EASi yet are included. */
function plannedSources() {
  var d = S.data || {};
  return ['portal', 'ba54', 'rwa'].filter(function (k) { return d[k] && d[k].read; }).map(function (k) { return PLAN_SOURCES[k].name; });
}

/** How the page talks about each planning sheet. */
var PLAN_SOURCES = {
  portal: { name: 'the BA61 portal', short: 'portal', program: 'PG61', person: 'COR', amount: 'Budgeted in the portal', amountShort: 'budgeted in the BA61 portal',
    number: 'The project’s BA61 portal number', match: function () { return 'No PR in EASi has this project’s number in its title or as its EQ number yet.'; } },
  ba54: { name: 'the BA54 tracker', short: 'tracker', program: 'PG54', person: 'Project manager (COR)', amount: 'Total cost (BA54 tracker)', amountShort: 'total cost in the BA54 tracker',
    number: 'The project’s PCN in the BA54 tracker',
    match: function (p) { return 'No PR in EASi' + (p.fy ? ' from FY' + String(p.fy - 1).slice(2) + ' on' : '') + ' lists this project’s PCN or ASID among its project codes yet.'; } },
  rwa: { name: 'the RWA dashboard', short: 'RWA dashboard', program: 'PG80', person: 'GSA PM (COR)', amount: 'Authorized (RWA)', amountShort: 'authorized on the RWA',
    number: 'The RWA or work request number in RETA', match: function () { return 'No PR in EASi lists this RWA number yet, and nothing is committed or obligated on it.'; } }
};
function planSource(p) { return PLAN_SOURCES[p.source] || PLAN_SOURCES.portal; }
function hasPlanned() { return plannedSources().length > 0; }
function statusOptions() { return STATUS_OPTIONS.filter(function (s) { return !s.planned || hasPlanned(); }); }
/** A project from the BA61 portal or BA54 tracker that has no PR in EASi yet. */
function isPlanned(p) { return !!p.source; }

/**
 * Plan vs. EASi for a PR that carries planned projects: { planned, committed, ratio, key, label }.
 * key: 'over' / 'under' (more than 25% off the plan), 'near', 'none' (nothing committed yet), 'mixed' (the PR
 * is also funded from other programs, so its committed amount isn't comparable), 'noamount' (the plan has no
 * amount), 'shared' (a plan spread over several PRs), or '' with no plan.
 */
function planCheck(p) {
  if (p._plan !== undefined) return p._plan;
  var plans = p.plans || [];
  var planned = plans.reduce(function (s, x) { return s + (x.estimate || 0); }, 0);
  var out = { planned: planned, committed: p.committed, ratio: null, key: '', label: '' };
  var planPrograms = plans.map(function (x) { return planSource(x).program; });
  var others = p.programs.filter(function (c) { return planPrograms.indexOf(c) === -1; });
  if (plans.length && planned <= 0) { out.key = 'noamount'; out.label = 'No amount in the plan'; }
  else if (plans.length) {
    if (p.committed <= 0) { out.key = 'none'; out.label = 'Nothing committed in EASi yet'; }
    else if (plans.some(function (x) { return x.prCount > 1; })) {
      out.key = 'shared';
      out.label = 'The plan is spread over several PRs, so this one isn’t comparable to it';
    }
    else if (others.length) {
      out.key = 'mixed';
      out.label = 'Also funded from ' + others.map(function (c) { return c.replace(/^PG/, 'BA'); }).join(', ') + ', so not comparable to the plan';
    }
    else {
      out.ratio = p.committed / planned - 1;
      out.key = out.ratio > 0.25 ? 'over' : out.ratio < -0.25 ? 'under' : 'near';
      out.label = (out.ratio >= 0 ? '+' : '−') + Math.round(Math.abs(out.ratio) * 100) + '% vs. plan';
    }
  }
  p._plan = out;
  return out;
}

/** Small stroked icons (24-unit grid, 2px stroke), drawn inline so they follow the text color. */
var ICON_PATHS = {
  up: 'M7 14l5-5 5 5',
  down: 'M7 10l5 5 5-5',
  chevron: 'M6 9l6 6 6-6',
  close: 'M6 6l12 12M18 6L6 18',
  arrow: 'M5 12h14M13 6l6 6-6 6',
  external: 'M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5',
  info: 'M12 8h.01M11 12h1v5h1M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z',
  filter: 'M4 6h16M7 12h10M10 18h4'
};
function icon(name, cls) {
  var ns = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('class', 'icon' + (cls ? ' ' + cls : ''));
  var path = document.createElementNS(ns, 'path');
  path.setAttribute('d', ICON_PATHS[name]);
  svg.appendChild(path);
  return svg;
}

var S = {
  data: null,
  user: null,
  view: 'overview',
  filters: { sc: '', office: '', programs: PROGRAM_LABELS.slice(), status: 'open', stage: '', fy: '', q: '', person: null, type: 'projects', team: 'all', zone: '', planned: true, check: '' },
  projects: { sort: [{ key: 'stageOrder', dir: 1 }], group: '', collapsed: {}, limit: 400, groupLimit: {} },
  workload: { role: 'lead', sort: [{ key: 'count', dir: -1 }], byOffice: false },
  officesSort: [{ key: 'count', dir: -1 }],
  stageIndex: {},
  homeOffice: {}
};

function h(tag, attrs) {
  var el = document.createElement(tag);
  if (attrs) {
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.keys(v).forEach(function (s) { el.style.setProperty(s, v[s]); });
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'text') el.textContent = v;
      else el.setAttribute(k, v === true ? '' : v);
    });
  }
  for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
  return el;
}

function append(el, child) {
  if (child === null || child === undefined || child === false) return;
  if (Array.isArray(child)) { child.forEach(function (c) { append(el, c); }); return; }
  el.appendChild(child instanceof Node ? child : document.createTextNode(String(child)));
}

function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }

// ---------- Formatting ----------
function fmtInt(n) { return Math.round(n || 0).toLocaleString('en-US'); }
function fmtMoney(n) { return '$' + Math.round(n || 0).toLocaleString('en-US'); }
function fmtMoneyShort(n) {
  n = n || 0;
  var a = Math.abs(n);
  // One rule everywhere so a column of amounts reads at a glance: $1.37B, $84.6M, $8.9M, $686K, $7.2K, $950.
  if (a >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
  if (a >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
  if (a >= 1e5) return '$' + Math.round(n / 1e3) + 'K';
  if (a >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K';
  return fmtMoney(n);
}
function fmtDate(iso) {
  if (!iso) return '';
  var p = iso.split('-');
  return Number(p[1]) + '/' + Number(p[2]) + '/' + p[0];
}
function fmtDateTime(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function plural(n, word, many) { return fmtInt(n) + ' ' + (n === 1 ? word : (many || word + 's')); }

function teamOf(email) { return (S.data && S.data.teams && S.data.teams[email]) || ''; }
function orgOf(email) { return (S.data && S.data.orgs && S.data.orgs[email]) || ''; }
function teamLabel(key, short) {
  var t = TEAM_OPTIONS.filter(function (x) { return x.key === key; })[0];
  return t ? (short && t.short ? t.short : t.label) : '';
}

function personName(email) {
  if (!email) return '';
  if (S.data && S.data.people[email]) return S.data.people[email];
  var local = String(email).split('@')[0].replace(/\d+$/, '');
  return local.split(/[._-]+/).filter(String).map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ') || email;
}
function peopleNames(list) { return (list || []).map(personName).join(', '); }

// ---------- PR helpers ----------
function programLabels(p) {
  if (p._labels) return p._labels;
  var out = [];
  (S.data.programs || []).forEach(function (prog) { if (p.programs.indexOf(prog.code) !== -1) out.push(prog.label); });
  if (!out.length) out.push('Other');
  p._labels = out;
  return out;
}
function stageOf(p) { return S.stageIndex[p.stage] || { key: p.stage, label: p.stage, short: p.stage, group: 'preaward', order: 99 }; }
function officeShort(name) { return String(name || '').replace(/ Field Office$/, ''); }
function officeLabel(p) {
  if (p.offices.length) return p.offices.map(officeShort).join(', ');
  return p.serviceCenters.map(function (s) { return s.replace(/ Service Center$/, ''); }).join(', ') + ' SC';
}

/** Prepares the loaded dataset: stage order, searchable text, each person's home office. */
function prepareData(data) {
  // Planned projects leave out the EASi fields they don't have (data.plannedDefaults says what to fill in).
  var fill = data.plannedDefaults || { values: {}, lists: [] };
  data.prs.forEach(function (p) {
    if (!p.source) return;
    Object.keys(fill.values).forEach(function (k) { if (p[k] === undefined) p[k] = fill.values[k]; });
    fill.lists.forEach(function (k) { if (!p[k]) p[k] = []; });
  });
  S.stageIndex = {};
  data.stages.forEach(function (s, i) { s.order = i; S.stageIndex[s.key] = s; });
  data.prs.forEach(function (p) {
    p.stageOrder = S.stageIndex[p.stage] ? S.stageIndex[p.stage].order : 99;
    p._search = [p.pr, p.title, p.vendor, p.awardNumber, p.buildings.join(' '), p.buildingNames.join(' '), p.portalNumbers.join(' '),
      (p.plans || []).map(function (x) { return x.id + ' ' + x.title + ' ' + x.person; }).join(' '),
      (p.subprojects || []).map(function (s) { return s.id + ' ' + s.title; }).join(' '),
      p.offices.join(' '), p.rwas.join(' '), p.projectCodes.join(' ')]
      .concat(['lead', 'cor', 'requestor', 'co', 'cs', 'programManager', 'buildingManager'].map(function (r) {
        return (p[r] || []).map(function (e) { return e + ' ' + (data.people[e] || ''); }).join(' ');
      })).join(' ').toLowerCase();
  });
  S.homeOffice = {};
  data.roles.forEach(function (role) {
    var tally = {};
    data.prs.forEach(function (p) {
      (p[role.key] || []).forEach(function (e) {
        tally[e] = tally[e] || {};
        p.offices.forEach(function (o) { tally[e][o] = (tally[e][o] || 0) + 1; });
      });
    });
    S.homeOffice[role.key] = {};
    Object.keys(tally).forEach(function (e) {
      var best = '', n = 0;
      Object.keys(tally[e]).forEach(function (o) { if (tally[e][o] > n) { best = o; n = tally[e][o]; } });
      S.homeOffice[role.key][e] = best;
    });
  });
}

// ---------- Filtering ----------
function matchesStatus(p, status) {
  var g = stageOf(p).group;
  if (status === 'open') return p.stage !== 'expended';
  if (status === 'planned') return g === 'planned';
  if (status === 'preaward') return g === 'preaward';
  if (status === 'awarded') return p.stage === 'awarded';
  if (status === 'expended') return p.stage === 'expended';
  return true;
}

/** The PRs that pass the filters. skip: { status, person, place, check: true } leaves that filter out. */
function filtered(skip) {
  skip = skip || {};
  var f = S.filters;
  var q = f.q.trim().toLowerCase();
  var terms = q ? q.split(/\s+/) : [];
  var progs = f.programs;
  return S.data.prs.filter(function (p) {
    if (!f.planned && isPlanned(p)) return false;
    if (!skip.check && f.check && !attentionDetail(f.check, p)) return false;
    if (f.type === 'projects' && p.service) return false;
    if (f.type === 'service' && !p.service) return false;
    if (!skip.place && f.office && p.offices.indexOf(f.office) === -1) return false;
    if (!skip.place && !f.office && f.sc && p.serviceCenters.indexOf(f.sc) === -1) return false;
    if (!skip.place && !f.office && !f.sc && f.zone && (p.zones || []).indexOf(f.zone) === -1) return false;
    if (progs.length < PROGRAM_LABELS.length && !programLabels(p).some(function (l) { return progs.indexOf(l) !== -1; })) return false;
    if (!skip.status) {
      if (f.stage) { if (p.stage !== f.stage) return false; }
      else if (!matchesStatus(p, f.status)) return false;
    }
    if (f.fy && String(p.fy) !== String(f.fy)) return false;
    if (!skip.person && f.person && (p[f.person.role] || []).indexOf(f.person.email) === -1) return false;
    if (f.team !== 'all' && !p.lead.some(function (e) { return teamOf(e) === f.team; })) return false;
    for (var i = 0; i < terms.length; i++) if (p._search.indexOf(terms[i]) === -1) return false;
    return true;
  });
}

function officesInScope() {
  var f = S.filters;
  return S.data.offices.filter(function (o) {
    if (f.office) return o.name === f.office;
    if (f.sc) return o.serviceCenter === f.sc;
    if (f.zone) return o.zone === f.zone;
    return true;
  });
}

// ---------- Aggregation ----------
function emptyTotals() {
  return { count: 0, open: 0, planned: 0, preaward: 0, awarded: 0, expended: 0, BA61: 0, BA80: 0, BA54: 0, Other: 0, committed: 0, obligated: 0, remaining: 0, expendedAmt: 0, estimate: 0 };
}
/** How many projects a PR is: a multi-project PR counts each of its sub-projects. */
function unitsOf(p) { return p.units || 1; }
function countOf(list) { return list.reduce(function (s, p) { return s + unitsOf(p); }, 0); }

function addTo(t, p) {
  var n = unitsOf(p);
  t.count += n;
  t.prs = (t.prs || 0) + 1;
  var g = stageOf(p).group;
  if (p.stage !== 'expended') t.open += n;
  if (g === 'planned') t.planned += n;
  if (g === 'preaward') t.preaward += n;
  if (p.stage === 'awarded') t.awarded += n;
  if (p.stage === 'expended') t.expended += n;
  programLabels(p).forEach(function (l) { t[l] += n; });
  t.committed += p.committed;
  t.obligated += p.obligated;
  t.remaining += p.remaining;
  t.expendedAmt += p.expended;
  // Planned projects' budgets and costs: estimates, kept apart from what EASi has committed.
  t.estimate += p.estimate || 0;
  return t;
}
function totalsOf(list) { var t = emptyTotals(); list.forEach(function (p) { addTo(t, p); }); return t; }

/** People in a role with their totals. byOffice splits each person by field office. */
function workloadRows(list, roleKey, byOffice) {
  var rows = {};
  list.forEach(function (p) {
    var people = p[roleKey] && p[roleKey].length ? p[roleKey] : [''];
    var offices = byOffice ? (p.offices.length ? p.offices : ['']) : [null];
    people.forEach(function (email) {
      // With a lead team chosen, only that team's people are ranked (in any role).
      if (S.filters.team !== 'all' && email && teamOf(email) !== S.filters.team) return;
      offices.forEach(function (office) {
        var key = (office || '') + '|' + email;
        if (!rows[key]) {
          rows[key] = emptyTotals();
          rows[key].email = email;
          rows[key].name = email ? personName(email) : '(none in EASi)';
          rows[key].office = byOffice ? office : (S.homeOffice[roleKey] && S.homeOffice[roleKey][email]) || '';
          rows[key].oldestFy = null;
          rows[key].team = teamOf(email);
          rows[key].org = orgOf(email);
        }
        addTo(rows[key], p);
        if (p.fy && (rows[key].oldestFy === null || p.fy < rows[key].oldestFy) && p.stage !== 'expended') rows[key].oldestFy = p.fy;
      });
    });
  });
  return Object.keys(rows).map(function (k) { return rows[k]; });
}

// ---------- Sorting ----------
function sortRows(rows, sorts, accessors) {
  accessors = accessors || {};
  var keyed = rows.map(function (r, i) { return { r: r, i: i }; });
  keyed.sort(function (a, b) {
    for (var s = 0; s < sorts.length; s++) {
      var key = sorts[s].key;
      var get = accessors[key] || function (x) { return x[key]; };
      var va = get(a.r), vb = get(b.r);
      var c = compareValues(va, vb);
      if (c) return c * sorts[s].dir;
    }
    if (a.r.name !== undefined && b.r.name !== undefined) { var n = compareValues(a.r.name, b.r.name); if (n) return n; }
    return a.i - b.i;
  });
  return keyed.map(function (k) { return k.r; });
}
function compareValues(a, b) {
  var ea = a === null || a === undefined || a === '', eb = b === null || b === undefined || b === '';
  if (ea || eb) return ea && eb ? 0 : ea ? 1 : -1;
  if (typeof a === 'number' && typeof b === 'number') return a - b;
  return String(a).localeCompare(String(b), 'en', { numeric: true, sensitivity: 'base' });
}
/** Click a header: sort by it (again flips it). Shift-click: add it as the next sort key. */
function toggleSort(sorts, key, multi, defaultDir) {
  var existing = null;
  sorts.forEach(function (s) { if (s.key === key) existing = s; });
  if (multi) {
    if (existing) existing.dir = -existing.dir;
    else sorts.push({ key: key, dir: defaultDir || 1 });
    return sorts;
  }
  if (existing && sorts[0] === existing) return [{ key: key, dir: -existing.dir }];
  return [{ key: key, dir: existing ? existing.dir : (defaultDir || 1) }];
}

/** A sortable header cell. cols: { key, label, num, dir } */
function sortHeader(col, sorts, onSort) {
  var idx = -1;
  sorts.forEach(function (s, i) { if (s.key === col.key) idx = i; });
  var active = idx !== -1;
  var dir = active ? sorts[idx].dir : 0;
  var th = h('th', {
    class: 'sortable' + (col.num ? ' num' : '') + (col.hideSm ? ' hide-sm' : ''),
    scope: 'col',
    tabindex: '0',
    title: 'Sort by ' + col.label.toLowerCase(),
    'aria-sort': idx === 0 ? (dir > 0 ? 'ascending' : 'descending') : 'none'
  }, h('span', { class: 'th-inner' }, col.label, h('span', { class: 'arrow' }, active ? icon(dir > 0 ? 'up' : 'down') : null),
    active && sorts.length > 1 ? h('span', { class: 'rank' }, String(idx + 1)) : null));
  var go = function (e) { onSort(col.key, e.shiftKey, col.dir || (col.num ? -1 : 1)); };
  th.addEventListener('click', go);
  th.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(e); } });
  return th;
}

// ---------- Misc ----------
function toCsv(rows) {
  return rows.map(function (r) {
    return r.map(function (v) {
      var s = v === null || v === undefined ? '' : String(v);
      if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',');
  }).join('\r\n');
}
function downloadFile(name, content, type) {
  var blob = new Blob(['﻿' + content], { type: type });
  var url = URL.createObjectURL(blob);
  var a = h('a', { href: url, download: name, target: '_blank' });
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
}
function toast(message) {
  var el = h('div', { class: 'toast', role: 'status' }, message);
  document.body.appendChild(el);
  setTimeout(function () { el.remove(); }, 3200);
}

var tooltipEl = null;
function showTooltip(evt, title, rows) {
  hideTooltip();
  tooltipEl = h('div', { class: 'tooltip', role: 'tooltip' }, h('div', { class: 'tt-title' }, title),
    rows.map(function (r) {
      return h('div', { class: 'tt-row' }, h('span', null, r.color ? h('span', { class: 'swatch', style: { background: r.color } }) : null, r.label), h('strong', { class: 'num' }, r.value));
    }));
  document.body.appendChild(tooltipEl);
  moveTooltip(evt);
}
function moveTooltip(evt) {
  if (!tooltipEl) return;
  var x = evt.clientX + 14, y = evt.clientY + 14;
  var w = tooltipEl.offsetWidth, ht = tooltipEl.offsetHeight;
  if (x + w > window.innerWidth - 8) x = evt.clientX - w - 14;
  if (y + ht > window.innerHeight - 8) y = evt.clientY - ht - 14;
  tooltipEl.style.left = Math.max(8, x) + 'px';
  tooltipEl.style.top = Math.max(8, y) + 'px';
}
function hideTooltip() { if (tooltipEl) { tooltipEl.remove(); tooltipEl = null; } }
function withTooltip(el, title, rowsFn) {
  el.addEventListener('mouseenter', function (e) { showTooltip(e, title, rowsFn()); });
  el.addEventListener('mousemove', moveTooltip);
  el.addEventListener('mouseleave', hideTooltip);
  el.addEventListener('focus', function () {
    var r = el.getBoundingClientRect();
    showTooltip({ clientX: r.left + r.width / 2, clientY: r.bottom }, title, rowsFn());
  });
  el.addEventListener('blur', hideTooltip);
  return el;
}

/** A stacked bar of segments [{ value, color }] scaled to max; avg draws a reference line at that value. */
function stackedBar(segments, max, cls, avg) {
  var bar = h('div', { class: cls || 'hbar-track' });
  segments.forEach(function (s) {
    if (!s.value) return;
    bar.appendChild(h('div', { class: 'seg-fill', style: { width: (max ? (s.value / max) * 100 : 0) + '%', background: s.color } }));
  });
  if (avg && max) bar.appendChild(h('div', { class: 'avg-line', style: { left: Math.min(100, (avg / max) * 100) + '%' } }));
  return bar;
}

/** Stage-group segments for a totals row, skipping groups the current filters leave out. */
function groupSegments(t) {
  return [{ value: t.planned, color: GROUP_COLORS.planned }, { value: t.preaward, color: GROUP_COLORS.preaward }, { value: t.awarded, color: GROUP_COLORS.awarded }, { value: t.expended, color: GROUP_COLORS.closed }];
}

/** The legend for stage-group bars: only the groups the status filter can show, plus the average line when drawn. */
function groupLegend(avgLabel) {
  var f = S.filters;
  var groups = f.stage ? [stageOf({ stage: f.stage }).group]
    : f.status === 'open' ? ['planned', 'preaward', 'awarded']
    : f.status === 'planned' ? ['planned']
    : f.status === 'preaward' ? ['preaward']
    : f.status === 'awarded' ? ['awarded']
    : f.status === 'expended' ? ['closed']
    : ['planned', 'preaward', 'awarded', 'closed'];
  if (!hasPlanned()) groups = groups.filter(function (g) { return g !== 'planned'; });
  return h('div', { class: 'legend' }, groups.map(function (g) {
    return h('span', null, h('span', { class: 'swatch', style: { background: GROUP_COLORS[g] } }), GROUP_LABELS[g]);
  }), avgLabel ? h('span', null, h('span', { class: 'swatch-line' }), avgLabel) : null);
}

/** Days from one 'yyyy-mm-dd' to the snapshot's day (or another date). */
function daysBetween(fromIso, toIso) {
  if (!fromIso) return null;
  var to = toIso || (S.data && S.data.builtAt ? S.data.builtAt.slice(0, 10) : new Date().toISOString().slice(0, 10));
  return Math.max(0, Math.round((Date.parse(to + 'T12:00:00Z') - Date.parse(fromIso.slice(0, 10) + 'T12:00:00Z')) / 86400000));
}

/** How long a project has been in its current stage: { days, known, since } or null when the tracker doesn't know. */
function stageAge(p) {
  if (!p.since) return null;
  return { days: daysBetween(p.since), known: !!p.sinceKnown, since: p.since };
}

/** Share of the obligation Pegasys shows spent (0-100), or null before award. */
function spentPct(p) {
  if (isPlanned(p) || !(p.stage === 'awarded' || p.stage === 'expended') || p.obligated <= 0) return null;
  return Math.min(100, Math.round(p.expended / p.obligated * 100));
}

/** Days since an awarded PR's spending last changed (since its award when nothing is spent): { days, known, since } or null. */
function paymentAge(p) {
  if (!p.spentSince) return null;
  return { days: daysBetween(p.spentSince), known: !!p.spentKnown, since: p.spentSince };
}

/** "27 days" (known) or "40+ days" (in this stage at least since tracking began); '' when it says nothing. */
function stageAgeText(p) {
  var a = stageAge(p);
  if (!a || (!a.known && a.days < 1)) return '';
  return plural(a.days, 'day') + (a.known ? '' : '+');
}

function stageBadge(p) {
  var st = stageOf(p);
  return h('span', { class: 'stage' }, h('span', { class: 'swatch', style: { background: GROUP_COLORS[st.group] } }), st.short);
}
function programTags(p) {
  return programLabels(p).map(function (l) {
    return h('span', { class: 'tag' }, h('span', { class: 'swatch', style: { background: PROGRAM_COLORS[l] } }), l);
  });
}
</script>
