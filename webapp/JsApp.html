<script>
/* ==========================================================================
   App shell, filters and the three views: Overview, Projects, Workload.
   ========================================================================== */
var VIEWS = [
  { key: 'overview', label: 'Overview' },
  { key: 'projects', label: 'Projects' },
  { key: 'workload', label: 'People' }
];

var PROJECT_COLUMNS = [
  { key: 'pr', label: 'PR number' },
  { key: 'title', label: 'Project' },
  { key: 'program', label: 'Program' },
  { key: 'stageOrder', label: 'Status' },
  { key: 'office', label: 'Field office' },
  { key: 'leadName', label: 'Assigned to' },
  { key: 'committed', label: 'Committed', num: true },
  { key: 'remaining', label: 'Left to spend', num: true },
  { key: 'executed', label: 'Contractor', dir: -1 }
];
var PROJECT_ACCESSORS = {
  program: function (p) { return programLabels(p).join('/'); },
  office: function (p) { return officeLabel(p); },
  leadName: function (p) { return peopleNames(p.lead); }
};
/** The CSV export: everything, at full precision, whatever the table shows. */
var PROJECT_CSV = [
  ['PR', function (p) { return p.pr; }], ['Title', function (p) { return p.title; }],
  ['Projects', function (p) { return unitsOf(p); }], ['Sub-projects', function (p) { return (p.subprojects || []).map(function (s) { return s.id + ' ' + s.title; }).join('; '); }], ['Program', function (p) { return programLabels(p).join(' / '); }],
  ['Status', function (p) { return stageOf(p).label; }], ['Field office', function (p) { return officeLabel(p); }], ['Service center', function (p) { return p.serviceCenters.join('; '); }],
  ['Building', function (p) { return p.buildings.join(' '); }], ['Building names', function (p) { return p.buildingNames.join('; '); }],
  ['Assigned to', function (p) { return peopleNames(p.lead); }], ['Role', function (p) { return p.lead.map(function (e) { return teamLabel(teamOf(e), true); }).join('; '); }], ['Org code', function (p) { return p.lead.map(orgOf).join('; '); }], ['COR', function (p) { return peopleNames(p.cor); }], ['Submitter', function (p) { return peopleNames(p.requestor); }],
  ['Planned in', function (p) { return p.sourceLabel || 'EASi'; }], ['Estimated cost (not in EASi yet)', function (p) { return isPlanned(p) ? p.estimate : ''; }],
  ['Committed', function (p) { return p.committed; }], ['Obligated', function (p) { return p.obligated; }], ['Expended', function (p) { return p.expended; }], ['Left to spend', function (p) { return p.remaining; }],
  ['PR fiscal year', function (p) { return p.fy || ''; }], ['Awarded', function (p) { return p.executed; }], ['Vendor', function (p) { return p.vendor; }], ['Award number', function (p) { return p.awardNumber; }],
  ['Acquisition status', function (p) { return p.acquisitionStatus; }], ['PR status', function (p) { return p.prStatus; }],
  ['Contracting officer', function (p) { return peopleNames(p.co); }], ['Contract specialist', function (p) { return peopleNames(p.cs); }], ['Building manager', function (p) { return peopleNames(p.buildingManager); }],
  ['BA61 portal number', function (p) { return p.portalNumbers.join(' '); }],
  ['Plan', function (p) { return (p.plans || []).map(function (x) { return x.sourceLabel + ' ' + x.id; }).join('; '); }],
  ['Planned amount', function (p) { return p.plans && p.plans.length ? planCheck(p).planned : ''; }], ['Committed vs. plan', function (p) { return planCheck(p).label; }], ['Status in the plan', function (p) { return p.planStatus || ''; }],
  ['Service contract', function (p) { return p.service; }], ['Link', function (p) { return p.link; }]
];
var GROUPS = [
  { key: '', label: 'No grouping' },
  { key: 'office', label: 'Field office' },
  { key: 'lead', label: 'Person assigned' },
  { key: 'team', label: 'Building or project manager' },
  { key: 'org', label: 'Org code' },
  { key: 'stage', label: 'Status' },
  { key: 'program', label: 'Program' },
  { key: 'building', label: 'Building' },
  { key: 'fy', label: 'Fiscal year' },
  { key: 'plan', label: 'Plan vs. EASi' }
];
/** The "Plan vs. EASi" groups, in order. */
var PLAN_GROUPS = [
  ['planned', 'Planned, not in EASi yet'], ['over', 'In EASi, committed more than 25% over the plan'], ['near', 'In EASi, within 25% of the plan'],
  ['under', 'In EASi, committed more than 25% under the plan'], ['none', 'In EASi with a plan, nothing committed yet'],
  ['mixed', 'In EASi with a plan, also funded from other programs'], ['shared', 'In EASi, the plan is spread over several PRs'], ['noamount', 'In EASi with a plan that has no amount'], ['', 'No plan on file (EASi only)']
];

// ---------------------------------------------------------------------------
// Start-up
// ---------------------------------------------------------------------------
function start() {
  applyRoute(BOOT.route || {});
  load(false);
}

function load(refresh) {
  // The first time, the data usually came with the page (BOOT.preload).
  if (!refresh && !S.data && BOOT.preload && typeof DecompressionStream === 'function') {
    var pre = BOOT.preload;
    BOOT.preload = null;
    renderState('Loading the project workload…', '', true);
    gunzipJson(pre.gz).then(function (data) { show(data, pre.user, false); }).catch(function () { load(false); });
    return;
  }
  var fn = refresh ? 'apiRefresh' : 'apiLoad';
  if (!S.data) renderState('Loading the project workload…', 'This can take up to a minute the first time each morning, while the EASi report is read.', true);
  var fail = function (err) {
    if (S.data) { toast('Could not refresh: ' + (err && err.message || err)); render(); return; }
    renderState('The tracker could not load', 'Please reload the page in a minute. If it keeps happening, tell the person who sent you the link. (' + ((err && err.message) || String(err)) + ')', false);
  };
  // The snapshot comes gzipped when the browser can unpack it (a tenth of the size).
  var packed = typeof DecompressionStream === 'function';
  google.script.run
    .withSuccessHandler(function (json) {
      var res = JSON.parse(json);
      (res.gz ? gunzipJson(res.gz) : Promise.resolve(res.data)).then(function (data) { show(data, res.user, refresh); }).catch(fail);
    })
    .withFailureHandler(fail)[fn]({ packed: packed });
}

function show(data, user, refreshed) {
  var first = !S.data;
  S.data = data;
  S.user = user;
  prepareData(S.data);
  if (first) applyDefaultsForUser();
  render();
  if (refreshed) toast('Refreshed from the EASi report.');
}

/** base64 gzip -> parsed JSON, with the browser's own decompressor. */
function gunzipJson(base64) {
  var bin = atob(base64);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Response(stream).text().then(JSON.parse);
}

function applyRoute(r) {
  var f = S.filters;
  if (r.view && VIEWS.some(function (v) { return v.key === r.view; })) S.view = r.view;
  if (r.office) f.office = r.office;
  if (r.sc) f.sc = r.sc;
  if (r.zone && /^\d+$/.test(r.zone)) f.zone = r.zone;
  if (r.program) {
    var list = r.program.toUpperCase().split(/[ ,]+/).map(function (p) { return p === 'OTHER' ? 'Other' : p; })
      .filter(function (p) { return PROGRAM_LABELS.indexOf(p) !== -1; });
    if (list.length) f.programs = list;
  }
  if (r.planned === '0') f.planned = false;
  if (r.status && STATUS_OPTIONS.some(function (s) { return s.key === r.status; })) f.status = r.status;
  if (r.fy && /^\d{4}$/.test(r.fy)) f.fy = r.fy;
  if (r.type && TYPE_OPTIONS.some(function (t) { return t.key === r.type; })) f.type = r.type;
  if (r.team && TEAM_OPTIONS.some(function (t) { return t.key === r.team; })) f.team = r.team;
  if (r.q) f.q = r.q;
  if (r.role) S.workload.role = r.role;
  if (r.person) f.person = { role: r.role || 'lead', email: r.person.toLowerCase() };
  if (r.group) S.projects.group = r.group;
  S.routeHadScope = !!(r.office || r.sc);
}

/** Field Office Managers open on their office, Service Center Directors on their service center. */
function applyDefaultsForUser() {
  var f = S.filters;
  if (f.office && !S.data.offices.some(function (o) { return o.name === f.office; })) f.office = '';
  if (f.sc && !S.data.serviceCenters.some(function (s) { return s.name === f.sc; })) f.sc = '';
  if (f.zone && S.data.zones.indexOf(f.zone) === -1) f.zone = '';
  if (!S.data.roles.some(function (r) { return r.key === S.workload.role && r.menu !== false; })) S.workload.role = 'lead';
  if (!statusOptions().some(function (s) { return s.key === f.status; })) f.status = 'open';
  if (S.routeHadScope || !S.user) return;
  var u = S.user;
  var lead = u.email && S.homeOffice.lead ? S.homeOffice.lead[u.email] : '';
  var officeOf = function (name) { return S.data.offices.filter(function (o) { return o.name === name; })[0]; };
  // Field Office Managers, then Service Center Directors, then the org code in the person's
  // GSA profile (as in the NEH BA61 Project Portal), then where they lead the most projects.
  if (u.manages.length === 1) S.scopeNote = { kind: 'manager', office: u.manages[0] };
  else if (u.directs.length === 1) S.scopeNote = { kind: 'director', sc: u.directs[0] };
  else if (u.orgOffice && officeOf(u.orgOffice)) S.scopeNote = { kind: 'org', office: u.orgOffice };
  else if (u.orgSc) S.scopeNote = { kind: 'org', sc: u.orgSc };
  else if (lead && officeOf(lead)) S.scopeNote = { kind: 'lead', office: lead };
  else return;
  if (S.scopeNote.office) { f.office = S.scopeNote.office; f.sc = officeOf(f.office).serviceCenter; f.zone = officeOf(f.office).zone; }
  else {
    f.sc = S.scopeNote.sc;
    var sc = S.data.serviceCenters.filter(function (x) { return x.name === f.sc; })[0];
    if (sc) f.zone = sc.zone;
  }
}

function syncUrl() {
  try {
    var f = S.filters, p = {};
    if (S.view !== 'overview') p.view = S.view;
    if (f.office) p.office = f.office;
    else if (f.sc) p.sc = f.sc;
    else if (f.zone) p.zone = f.zone;
    if (f.programs.length < PROGRAM_LABELS.length) p.program = f.programs.join(',');
    if (f.status !== 'open') p.status = f.status;
    if (f.fy) p.fy = f.fy;
    if (f.type !== 'projects') p.type = f.type;
    if (!f.planned) p.planned = '0';
    if (f.team !== 'all') p.team = f.team;
    if (f.q) p.q = f.q;
    if (f.person) { p.person = f.person.email; p.role = f.person.role; }
    else if (S.view === 'workload' && S.workload.role !== 'lead') p.role = S.workload.role;
    if (S.view === 'projects' && S.projects.group) p.group = S.projects.group;
    google.script.history.replace(null, p);
  } catch (e) { /* outside Apps Script */ }
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function renderState(title, message, busy) {
  var app = clear(document.getElementById('app'));
  app.appendChild(h('div', { class: 'state' }, busy ? h('span', { class: 'spinner' }) : null, h('h2', null, title), h('p', null, message)));
}

function render() {
  hideTooltip();
  var app = clear(document.getElementById('app'));
  app.appendChild(topBar());
  var main = h('main', { id: 'main', tabindex: '-1' });
  main.appendChild(filterBar());
  var banner = scopeBanner();
  if (banner) main.appendChild(banner);
  if (S.view === 'overview') main.appendChild(overviewView());
  else if (S.view === 'projects') main.appendChild(projectsView());
  else main.appendChild(workloadView());
  main.appendChild(footnote());
  app.appendChild(main);
  syncUrl();
}

function rerender() {
  var y = window.scrollY;
  render();
  window.scrollTo(0, y);
}

function go(view) {
  S.view = view;
  render();
  window.scrollTo(0, 0);
}

function topBar() {
  var d = S.data;
  var refreshBtn = h('button', { class: 'btn-on-dark', type: 'button', title: 'Read the EASi report again' }, 'Refresh');
  refreshBtn.addEventListener('click', function () { refreshBtn.disabled = true; refreshBtn.textContent = 'Refreshing…'; load(true); });
  var tabs = h('div', { class: 'tabs', role: 'tablist', 'aria-label': 'Views' }, VIEWS.map(function (v) {
    return h('button', { class: 'tab', role: 'tab', type: 'button', 'aria-selected': String(S.view === v.key), onClick: function () { go(v.key); } }, v.label);
  }));
  return h('header', { class: 'topbar' }, h('div', { class: 'topbar-inner' },
    h('div', { class: 'brand' },
      h('span', { class: 'brand-title' }, d.scopeLabel + ' Projects'),
      h('span', { class: 'brand-sub' }, (d.zones.length > 1 ? 'Zones ' + d.zones.slice(0, -1).join(', ') + ' and ' + d.zones[d.zones.length - 1] : d.serviceCenters.map(function (s) { return s.short; }).join(' and ')) + ' · ' + andList(['EASi'].concat(plannedSources())))),
    h('div', { class: 'freshness' },
      h('span', null, 'EASi updated ' + (d.generatedAt ? fmtDateTime(d.generatedAt) : '(date unknown)')),
      refreshBtn),
    tabs));
}

function scopeBanner() {
  var n = S.scopeNote;
  if (!n || !S.user) return null;
  var f = S.filters;
  if (n.office ? f.office !== n.office : (f.sc !== n.sc || f.office)) return null;
  var why = n.kind === 'manager' ? ', the field office you manage.'
    : n.kind === 'director' ? ', the service center you lead.'
    : n.kind === 'org' ? (n.office ? ', your field office' : ', your service center') + (S.user.orgCode ? ' (' + S.user.orgCode + ' in your GSA profile).' : '.')
    : ', where you have the most projects.';
  return h('div', { class: 'banner', role: 'note' }, icon('info'),
    h('div', { class: 'banner-text' },
      h('span', null, 'Showing ', h('strong', null, n.office ? officeShort(n.office) : n.sc.replace(/ Service Center$/, '')), why),
      h('button', { class: 'link-btn', type: 'button', onClick: function () { f.office = ''; f.sc = ''; f.zone = ''; S.scopeNote = ''; rerender(); } }, 'Show all of ' + S.data.scopeLabel)));
}

function filterBar() {
  var f = S.filters, d = S.data;
  // Zone, then (under More filters) service center, then field office; each narrows the next.
  var zoneSel = h('select', { 'aria-label': 'Zone' }, h('option', { value: '' }, 'All zones'),
    d.zones.map(function (z) { return h('option', { value: z, selected: f.zone === z }, 'Zone ' + z); }));
  zoneSel.addEventListener('change', function () { f.zone = zoneSel.value; f.sc = ''; f.office = ''; rerender(); });
  var scSel = h('select', { 'aria-label': 'Service center' }, h('option', { value: '' }, 'All service centers'),
    d.serviceCenters.filter(function (s) { return !f.zone || s.zone === f.zone; })
      .map(function (s) { return h('option', { value: s.name, selected: f.sc === s.name && !f.office }, s.short); }));
  scSel.addEventListener('change', function () {
    f.sc = scSel.value; f.office = '';
    var sc = d.serviceCenters.filter(function (x) { return x.name === f.sc; })[0];
    if (sc) f.zone = sc.zone;
    rerender();
  });
  var foSel = h('select', { 'aria-label': 'Field office' }, h('option', { value: '' }, 'All field offices'),
    d.serviceCenters.filter(function (s) { return !f.zone || s.zone === f.zone; }).map(function (sc) {
      return h('optgroup', { label: (d.zones.length > 1 ? 'Zone ' + sc.zone + ' · ' : '') + sc.short }, d.offices.filter(function (o) { return o.serviceCenter === sc.name && (!f.sc || f.sc === sc.name || f.office === o.name); })
        .map(function (o) { return h('option', { value: o.name, selected: f.office === o.name }, o.short); }));
    }));
  foSel.addEventListener('change', function () {
    f.office = foSel.value;
    var o = d.offices.filter(function (x) { return x.name === f.office; })[0];
    if (o) { f.sc = o.serviceCenter; f.zone = o.zone; }
    rerender();
  });
  // One choice at a time: All, or a single program. (Clicking a program shows only it.)
  var allPrograms = f.programs.length === PROGRAM_LABELS.length;
  var programs = h('div', { class: 'seg', role: 'group', 'aria-label': 'Program' },
    h('button', { type: 'button', 'aria-pressed': String(allPrograms), onClick: function () { f.programs = PROGRAM_LABELS.slice(); rerender(); } }, 'All'),
    PROGRAM_LABELS.map(function (l) {
      var on = !allPrograms && f.programs.length === 1 && f.programs[0] === l;
      return h('button', {
        type: 'button', 'aria-pressed': String(on),
        title: l === 'Other' ? 'Other budget activities, or none listed' : (d.programs.filter(function (p) { return p.label === l; })[0] || {}).name,
        onClick: function () { f.programs = [l]; rerender(); }
      }, h('span', { class: 'dot', style: { background: PROGRAM_COLORS[l] } }), l);
    }));
  var status = h('div', { class: 'seg', role: 'group', 'aria-label': 'Status' }, statusOptions().map(function (s) {
    return h('button', { type: 'button', 'aria-pressed': String(!f.stage && f.status === s.key), title: s.help || null, onClick: function () { f.status = s.key; f.stage = ''; rerender(); } }, s.label);
  }));
  var years = {};
  d.prs.forEach(function (p) { if (p.fy) years[p.fy] = true; });
  var fySel = h('select', { 'aria-label': 'Fiscal year' }, h('option', { value: '' }, 'All years'),
    Object.keys(years).sort().reverse().map(function (y) { return h('option', { value: y, selected: String(f.fy) === y }, 'FY' + y.slice(2)); }));
  fySel.addEventListener('change', function () { f.fy = fySel.value; rerender(); });
  var serviceBox = h('input', { type: 'checkbox', checked: f.type !== 'projects' });
  serviceBox.addEventListener('change', function () { f.type = serviceBox.checked ? 'all' : 'projects'; rerender(); });
  var plannedBox = h('input', { type: 'checkbox', checked: f.planned });
  plannedBox.addEventListener('change', function () { f.planned = plannedBox.checked; if (!f.planned && f.status === 'planned') f.status = 'open'; rerender(); });
  var search = h('input', { type: 'search', placeholder: 'PR number, building, name…', value: f.q, 'aria-label': 'Search' });
  var timer = null;
  search.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      f.q = search.value;
      rerender();
      var again = document.querySelector('input[type="search"]');
      if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    }, 250);
  });

  var active = [];
  if (f.person) {
    var role = d.roles.filter(function (r) { return r.key === f.person.role; })[0] || { short: f.person.role };
    active.push(pill(role.short + ': ' + (f.person.email ? personName(f.person.email) : '(none)'), function () { f.person = null; }));
  }
  if (f.stage) active.push(pill('Status: ' + S.stageIndex[f.stage].label, function () { f.stage = ''; }));
  if (f.team !== 'all') active.push(pill(teamLabel(f.team) + ' only', function () { f.team = 'all'; }));
  var mineBtn = null;
  if (S.user && S.user.email && !f.person) {
    var myRole = null;
    ['lead', 'buildingManager', 'programManager', 'co', 'cs'].some(function (r) {
      if (d.prs.some(function (p) { return (p[r] || []).indexOf(S.user.email) !== -1; })) { myRole = r; return true; }
      return false;
    });
    if (myRole) mineBtn = h('button', { class: 'link-btn', type: 'button', onClick: function () { f.person = { role: myRole, email: S.user.email }; rerender(); } }, 'My projects');
  }
  var any = f.zone || f.sc || f.office || f.programs.length < PROGRAM_LABELS.length || f.status !== 'open' || f.stage || f.fy || f.q || f.person || f.type !== 'projects' || f.team !== 'all' || !f.planned;
  var reset = any ? h('button', { class: 'link-btn', type: 'button', onClick: resetFilters }, 'Reset filters') : null;

  // Service center, fiscal year and service contracts sit behind "More filters" unless one is in use.
  var more = S.moreFilters || !!f.fy || f.type !== 'projects' || !f.planned || (!!f.sc && !f.office);
  var moreBtn = h('button', { class: 'link-btn more-btn', type: 'button', 'aria-expanded': String(more), onClick: function () { S.moreFilters = !more; rerender(); } }, more ? 'Fewer filters' : 'More filters');

  // On a phone the filters fold into one line that says what is showing.
  var summary = [scopeName(), statusLabel(), f.programs.length < PROGRAM_LABELS.length ? f.programs.join(', ') : 'all programs',
    f.fy ? 'FY' + String(f.fy).slice(2) : '', !f.planned ? 'EASi only' : '', f.type !== 'projects' ? TYPE_OPTIONS.filter(function (t) { return t.key === f.type; })[0].label.toLowerCase() : '', f.q ? '“' + f.q + '”' : '']
    .filter(Boolean).join(' · ');
  var toggle = h('button', { class: 'filters-toggle', type: 'button', 'aria-expanded': String(!!S.filtersOpen), 'aria-controls': 'filter-row' },
    icon('filter'), h('span', { class: 'filters-summary' }, summary), h('span', { class: 'filters-action' }, S.filtersOpen ? 'Done' : 'Filters'));
  toggle.addEventListener('click', function () { S.filtersOpen = !S.filtersOpen; rerender(); });

  return h('section', { class: 'filters' + (S.filtersOpen ? ' open' : ''), 'aria-label': 'Filters' },
    toggle,
    h('div', { class: 'filter-row', id: 'filter-row' },
      d.zones.length > 1 ? h('label', { class: 'field' }, h('span', null, 'Zone'), zoneSel) : null,
      h('label', { class: 'field' }, h('span', null, 'Field office'), foSel),
      h('div', { class: 'field' }, h('span', null, 'Program'), programs),
      h('div', { class: 'field' }, h('span', null, 'Status'), status),
      h('label', { class: 'field' }, h('span', null, 'Search'), search),
      moreBtn),
    more ? h('div', { class: 'filter-row more-row' },
      h('label', { class: 'field' }, h('span', null, 'Service center'), scSel),
      h('label', { class: 'field' }, h('span', null, 'Fiscal year'), fySel),
      h('label', { class: 'check', title: 'Custodial, O&M, snow removal, utilities, option years and other recurring contracts. They are not projects, so they are left out unless you tick this.' }, serviceBox, h('span', null, 'Include service contracts')),
      hasPlanned() ? h('label', { class: 'check', title: 'Projects planned or approved in ' + andList(plannedSources()) + ' that have no PR in EASi yet. Untick to count only what is in EASi.' }, plannedBox, h('span', null, 'Include planned projects not in EASi yet')) : null) : null,
    (active.length || mineBtn || reset) ? h('div', { class: 'active-filters' }, active, mineBtn, reset) : null);
}

function pill(text, onRemove) {
  return h('span', { class: 'pill' }, text, h('button', { type: 'button', 'aria-label': 'Remove ' + text, onClick: function () { onRemove(); rerender(); } }, icon('close')));
}

function resetFilters() {
  S.filters = { sc: '', office: '', programs: PROGRAM_LABELS.slice(), status: 'open', stage: '', fy: '', q: '', person: null, type: 'projects', team: 'all', zone: '', planned: true };
  S.scopeNote = '';
  rerender();
}

function scopeName() {
  var f = S.filters;
  if (f.office) return officeShort(f.office);
  if (f.sc) return f.sc.replace(/ Service Center$/, '');
  if (f.zone) return 'Zone ' + f.zone;
  return S.data.scopeLabel;
}

// ---------------------------------------------------------------------------
// Overview
// ---------------------------------------------------------------------------
function overviewView() {
  var list = filtered();

/** "114 open projects", "13 projects not awarded yet", "40 projects paid in full", "8 projects with contracting". */
function projectsPhrase(n) {
  var f = S.filters;
  var p = plural(n, 'project');
  if (f.stage) return p + ': ' + S.stageIndex[f.stage].short.toLowerCase();
  if (f.status === 'open') return fmtInt(n) + ' open ' + (n === 1 ? 'project' : 'projects');
  if (f.status === 'awarded') return fmtInt(n) + ' awarded ' + (n === 1 ? 'project' : 'projects');
  if (f.status === 'preaward') return p + ' not awarded yet';
  if (f.status === 'planned') return p + ' not in EASi yet';
  if (f.status === 'expended') return p + ' paid in full';
  return p;
}

function statusLabel() {

/** Rows each group shows before its "Show more" row. */
var GROUP_ROWS = 50;

function groupProjects(list, key) {
  if (!key) return [{ key: null, items: list }];
  var map = {}, order = [];
  var put = function (k, label, p, sortKey) {
    if (!map[k]) { map[k] = { key: k, label: label, items: [], sortKey: sortKey === undefined ? label : sortKey }; order.push(map[k]); }
    map[k].items.push(p);
  };
  list.forEach(function (p) {
    if (key === 'office') (p.offices.length ? p.offices : ['']).forEach(function (o) { put('o:' + o, o ? officeShort(o) : 'Service center level (no building)', p, o || '~'); });
    else if (key === 'lead' || key === 'cor' || key === 'requestor') (p[key].length ? p[key] : ['']).forEach(function (e) { put(key + ':' + e, e ? personName(e) : '(none in EASi)', p, e ? personName(e) : '~'); });
    else if (key === 'stage') { var st = stageOf(p); put('s:' + st.key, st.label, p, st.order); }
    else if (key === 'program') programLabels(p).forEach(function (l) { put('p:' + l, l, p, PROGRAM_LABELS.indexOf(l)); });

    'A project shows up here when it is on an ' + d.scopeLabel + ' building (' + (d.zones.length > 1 ? 'Zones ' + d.zones.join(', ') : 'Zone ' + d.zones.join('')) + ') in the OFM Building Assignments sheet. ' + fmtInt(service) + ' service contracts (custodial, O&M, snow removal, utilities and the like) are left out unless you include them under More filters. ' +
    '“Paid in full” means Pegasys shows all the obligated money spent.' +
    (hasPlanned() ? ' Projects planned or approved in ' + andList(plannedSources()) + ' are listed as “Not in EASi yet” until a PR carries them: a BA61 portal project’s number in the PR title or as its EQ number, a BA54 project’s PCN or ASID among the PR’s project codes, an RWA’s number on the PR. RWAs and work requests count only while nothing is committed or obligated on them (one with money but no PR is funded another way, such as a lease or purchase card); severable RWAs count as service contracts. Then the PR shows the plan next to what EASi has committed.' : '')));
}

window.addEventListener('load', start);
</script>
